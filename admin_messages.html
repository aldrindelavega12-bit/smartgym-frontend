<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>


<script>

/* =========================================================
   API
========================================================= */

const API_URL =
    "https://smartgym-api-ia2e.onrender.com";


/* =========================================================
   ADMIN PROFILE NAME
========================================================= */

const adminName =
    document.getElementById("adminName");

const adminAvatar =
    document.getElementById("adminAvatar");


if(user){

    const fullname =
        user.fullname ||
        user.name ||
        user.full_name ||
        "Admin";


    if(adminName){

        adminName.innerText =
            fullname;

    }


    if(adminAvatar){

        adminAvatar.innerText =
            fullname
                .charAt(0)
                .toUpperCase();

    }

}


/* =========================================================
   ADMIN NAVBAR
========================================================= */

const menu =
    document.getElementById("menu");


menu.innerHTML = `

    <a href="admin.html">

        <i class="fa-solid fa-house"></i>

        Home

    </a>


    <a
        href="admin_messages.html"
        class="msg-link"
    >

        <i class="fa-solid fa-envelope"></i>

        Messages

        <span
            id="msg-count"
            class="msg-count"
        >
            0
        </span>

    </a>


    <a href="reports.html">

        <i class="fa-solid fa-chart-column"></i>

        Reports

    </a>


    <a href="members.html">

        <i class="fa-solid fa-users"></i>

        Members

    </a>


    <a href="walkin.html">

        <i class="fa-solid fa-person-walking"></i>

        Walk-ins

    </a>


    <a href="staff_manage.html">

        <i class="fa-regular fa-user"></i>

        Staff

    </a>

`;


/* =========================================================
   SOCKET
========================================================= */

const socket =
    io(
        API_URL,
        {
            transports:["websocket"]
        }
    );


/* =========================================================
   CURRENT MESSAGES
========================================================= */

let currentMessages = [];

let lastUnread = 0;


/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages(){

    try{

        const res =
            await fetch(
                `${API_URL}/api/admin_messages`,
                {
                    cache:"no-store"
                }
            );


        const data =
            await res.json();


        currentMessages =
            Array.isArray(data)
            ? data
            : [];


        const list =
            document.getElementById(
                "messages-list"
            );


        list.innerHTML = "";


        if(
            currentMessages.length === 0
        ){

            list.innerHTML = `

                <li class="msg-card">

                    No messages

                </li>

            `;

            return;

        }


        /* =================================================
           GROUP BY MEMBER / USER
        ================================================= */

        const grouped = {};


        currentMessages.forEach(
            msg => {

                const memberId =
                    msg.user_id ||
                    msg.member_id;


                if(!memberId){
                    return;
                }


                if(!grouped[memberId]){

                    grouped[memberId] = {

                        user_id:
                            memberId,

                        member_name:
                            msg.member_name ||
                            msg.sender_name ||
                            msg.fullname ||
                            "Member",

                        messages:[]

                    };

                }


                grouped[memberId]
                    .messages
                    .push(msg);

            }
        );


        /* =================================================
           CREATE ONE CARD PER MEMBER
        ================================================= */

        Object.values(grouped)
        .forEach(
            member => {


                /* =========================================
                   LATEST FIRST
                ========================================= */

                member.messages.sort(
                    (a,b) =>
                        Number(b.id) -
                        Number(a.id)
                );


                const latestMessage =
                    member.messages[0];


                const card =
                    document.createElement("li");


                card.className =
                    "msg-card " +
                    (
                        Number(
                            latestMessage.is_read
                        ) === 0
                        ? "unread"
                        : ""
                    );


                /* =========================================
                   OPEN MESSAGE
                ========================================= */

                card.onclick = () => {

                    openMessage(
                        latestMessage
                    );

                };


                /* =========================================
                   CARD
                ========================================= */

                card.innerHTML = `

                    <div class="msg-top">


                        <div class="sender-info">

                            <h3>
                                ${escapeHTML(
                                    member.member_name
                                )}
                            </h3>


                            <span class="sender-role">

                                ${escapeHTML(
                                    member.user_id
                                )}

                            </span>


                            ${
                                Number(
                                    latestMessage.is_read
                                ) === 0
                                ?
                                `
                                <span class="unread-badge">
                                    NEW / UNREAD
                                </span>
                                `
                                :
                                ""
                            }

                        </div>


                        <!-- THREE DOT -->

                        <div
                            class="dots"
                            onclick="
                                event.stopPropagation();
                                toggleMenu(${latestMessage.id})
                            "
                        >
                            ⋮
                        </div>


                    </div>


                    <div class="msg-content">

                        <p class="msg-text">

                            ${escapeHTML(
                                latestMessage.message ||
                                ""
                            )}

                        </p>


                        <small>

                            ${escapeHTML(
                                latestMessage.created_at ||
                                ""
                            )}

                        </small>

                    </div>


                    <!-- MENU -->

                    <div
                        id="menu-${latestMessage.id}"
                        class="msg-menu"
                    >

                        <button
                            onclick="
                                event.stopPropagation();
                                deleteMemberMessages('${member.user_id}')
                            "
                        >

                            Delete

                        </button>


                        <button
                            onclick="
                                event.stopPropagation();
                                markRead(${latestMessage.id})
                            "
                        >

                            Mark as Read

                        </button>


                        <button
                            onclick="
                                event.stopPropagation();
                                markUnread(${latestMessage.id})
                            "
                        >

                            Mark as Unread

                        </button>

                    </div>

                `;


                list.appendChild(card);

            }
        );


    }catch(err){

        console.error(
            "LOAD ADMIN MESSAGES ERROR:",
            err
        );

    }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================================================
   OPEN MESSAGE
========================================================= */

async function openMessage(msg){

    document.getElementById(
        "modalTitle"
    ).innerText =
        msg.title ||
        "Message";


    document.getElementById(
        "modalMessage"
    ).innerText =
        msg.message ||
        "";


    document.getElementById(
        "modalDate"
    ).innerText =
        msg.created_at ||
        "";


    document.getElementById(
        "messageModal"
    ).style.display =
        "flex";


    /* =========================================
       MARK THIS MESSAGE AS READ
    ========================================= */

    if(
        Number(msg.is_read) === 0
    ){

        try{

            await fetch(
                `${API_URL}/api/message_read/${msg.id}`,
                {
                    method:"POST"
                }
            );


            msg.is_read = 1;


            const local =
                currentMessages.find(
                    m =>
                        Number(m.id) ===
                        Number(msg.id)
                );


            if(local){
                local.is_read = 1;
            }


            loadMessages();

            loadMessageCount();


        }catch(err){

            console.error(
                "MARK MESSAGE READ ERROR:",
                err
            );

        }

    }

}

/* =========================================================
   DELETE ALL MEMBER MESSAGES
========================================================= */

async function deleteMemberMessages(
    memberId
){

    if(
        !confirm(
            "Delete all messages from this member?"
        )
    ){

        return;

    }


    const memberMessages =
        currentMessages.filter(
            msg =>
                String(
                    msg.user_id ||
                    msg.member_id
                ) ===
                String(memberId)
        );


    if(
        memberMessages.length === 0
    ){

        return;

    }


    try{

        await Promise.all(

            memberMessages.map(
                msg =>
                    fetch(
                        `${API_URL}/api/delete_message/${msg.id}`,
                        {
                            method:"DELETE"
                        }
                    )
            )

        );


        currentMessages =
            currentMessages.filter(
                msg =>
                    String(
                        msg.user_id ||
                        msg.member_id
                    ) !==
                    String(memberId)
            );


        await loadMessages();

        await loadMessageCount();


    }catch(err){

        console.error(
            "DELETE MEMBER MESSAGES ERROR:",
            err
        );

    }

}


/* =========================================================
   THREE DOT MENU
========================================================= */

function toggleMenu(id){

    document
        .querySelectorAll(".msg-menu")
        .forEach(
            menu => {

                if(
                    menu.id !==
                    `menu-${id}`
                ){

                    menu.classList.remove(
                        "show"
                    );

                }

            }
        );


    const menu =
        document.getElementById(
            `menu-${id}`
        );


    if(!menu){
        return;
    }


    const card =
        menu.closest(
            ".msg-card"
        );


    if(
        menu.classList.contains(
            "show"
        )
    ){

        menu.classList.remove(
            "show"
        );

        card?.classList.remove(
            "menu-open"
        );

    }else{

        menu.classList.add(
            "show"
        );

        card?.classList.add(
            "menu-open"
        );

    }

}

/* =========================================================
   MESSAGE COUNT
========================================================= */

async function loadMessageCount(){

    try{

        const res =
            await fetch(
                `${API_URL}/api/admin_messages`,
                {
                    cache:"no-store"
                }
            );


        const data =
            await res.json();


        const unread =
            Array.isArray(data)
            ?
            data.filter(
                m =>
                    Number(m.is_read) === 0
            ).length
            :
            0;


        /* =========================================
           NEW NOTIFICATION
        ========================================= */

        if(
            lastUnread !== 0 &&
            unread > lastUnread
        ){

            document
                .getElementById(
                    "notifSound"
                )
                ?.play()
                .catch(
                    () => {}
                );


            showNotifPopup(
                "New Message",
                `${unread - lastUnread} new notification`
            );

        }


        lastUnread =
            unread;


        const badge =
            document.getElementById(
                "msg-count"
            );


        if(!badge){
            return;
        }


        if(unread > 0){

            badge.innerText =
                unread > 99
                ? "99+"
                : unread;

            badge.style.display =
                "flex";

        }else{

            badge.style.display =
                "none";

        }


    }catch(err){

        console.error(
            "MESSAGE COUNT ERROR:",
            err
        );

    }

}


/* =========================================================
   NOTIFICATION POPUP
========================================================= */

function showNotifPopup(
    title,
    text
){

    const popup =
        document.getElementById(
            "notifPopup"
        );


    document.getElementById(
        "notifTitle"
    ).innerText =
        title;


    document.getElementById(
        "notifText"
    ).innerText =
        text;


    popup.classList.add(
        "show"
    );


    setTimeout(
        () => {

            popup.classList.remove(
                "show"
            );

        },
        4000
    );

}

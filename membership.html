<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script>


const API_URL =
    "https://smartgym-api-ia2e.onrender.com";


// ================= MASTER MODULE MENU =================

const MODULE_MENU = [
    {
        key: "dashboard",
        label: "Home",
        href: {
            pre_member: "pre_member.html",
            premember: "pre_member.html",
            member: "member.html",
            staff: "staff.html",
            front_desk: "staff.html",
            trainer: "trainer.html",
            manager: "manager.html",
            admin: "admin.html"
        }
    },
    {
        key: "messages",
        label: "Messages",
        href: "messages.html",
        memberHref: "member_messages.html",
        trainerHref: "trainer_messages.html",
        className: "msg-link"
    },
    { key: "program", label: "Program", href: "program.html" },
    { key: "get_program", label: "Get Program", href: "get_program.html" },
    { key: "book_locker", label: "Book Locker", href: "locker_booking.html" },
    { key: "membership", label: "Membership", href: "membership.html", active: true },
    { key: "attendance", label: "Attendance", href: "attendance.html" },
    { key: "locker", label: "Locker", href: "locker.html" },
    { key: "trainee", label: "Trainee", href: "trainee.html" },
    { key: "schedule", label: "Schedule", href: "trainer-schedule.html" },
    { key: "client_requests", label: "Client Requests", href: "client_requests.html" },
    { key: "reports", label: "Reports", href: "reports.html" },
    { key: "members", label: "Members", href: "members.html" },
    { key: "walkins", label: "Walk-ins", href: "walkin.html" },
    { key: "archive", label: "Archive", href: "archive.html" },
    { key: "user_account_maintenance", label: "User Account Maintenance", href: "user_accounts.html" },
    { key: "backup_restore", label: "Backup & Restore", href: "backup_restore.html" },
    { key: "audit_logs", label: "Audit Logs", href: "audit_logs.html" }
];

function normalizeModuleKey(value) {
    const key = String(value || "")
        .trim()
        .toLowerCase()
        .replace(/[\s-]+/g, "_");

    const aliases = {
        home: "dashboard",
        trainee_schedule: "schedule",
        client_request: "client_requests",
        walk_in: "walkins",
        walk_in_management: "walkins",
        user_accounts: "user_account_maintenance",
        user_account: "user_account_maintenance",
        backup: "backup_restore",
        backup_and_restore: "backup_restore",
        audit_log: "audit_logs"
    };

    return aliases[key] || key;
}

function getMembershipDashboardHref() {
    const role = String(
        userData.role || userData.user_type || ""
    )
        .trim()
        .toLowerCase()
        .replace(/[\s-]+/g, "_");

    const dashboard = MODULE_MENU.find(item => item.key === "dashboard");

    return dashboard.href[role] || "staff.html";
}

function renderMembershipMenu(allowedModules) {
    const menu = document.getElementById("menu");
    if (!menu) return;

    menu.innerHTML = "";

    const role = String(
        userData.role || userData.user_type || ""
    )
        .trim()
        .toLowerCase()
        .replace(/[\s-]+/g, "_");

    MODULE_MENU.forEach(item => {
        if (!allowedModules.has(item.key)) return;

        let href = typeof item.href === "object"
            ? item.href[role]
            : item.href;

        if (item.key === "messages") {
            if (role === "member") href = item.memberHref;
            if (role === "trainer") href = item.trainerHref;
        }

        if (!href) return;

        const link = document.createElement("a");

        link.href = href;
        link.dataset.module = item.key;
        link.textContent = item.label;

        if (item.className) {
            link.classList.add(item.className);
        }

        if (item.active) {
            link.classList.add("active");
        }

        if (item.key === "messages") {
            const badge = document.createElement("span");
            badge.id = "msg-count";
            badge.className = "msg-count";
            badge.textContent = "0";
            link.appendChild(badge);
        }

        menu.appendChild(link);
    });
}

async function checkMembershipPageAccess() {
    const userId =
        userData.user_id ||
        userData.member_id ||
        userData.id;

    if (!userId) {
        window.location.href = "index.html";
        return false;
    }

    try {
        const response = await fetch(
            `${API_URL}/api/user/module-access/${encodeURIComponent(userId)}`,
            { cache: "no-store" }
        );

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        const modules = Array.isArray(data)
            ? data
            : (data.modules || []);

        const allowedModules = new Set(
            modules.map(item =>
                normalizeModuleKey(
                    typeof item === "string"
                        ? item
                        : item.module_key ||
                          item.key ||
                          item.module_name ||
                          ""
                )
            )
        );

        renderMembershipMenu(allowedModules);

        if (!allowedModules.has("membership")) {
            alert("You do not have permission to access this module.");
            window.location.href = getMembershipDashboardHref();
            return false;
        }

        return true;

    } catch (error) {
        console.error("MEMBERSHIP ACCESS ERROR:", error);

        alert("Unable to verify module access. Please try again.");
        window.location.href = getMembershipDashboardHref();

        return false;
    }
}
/* =========================================================
   USER
========================================================= */

const profile =
    JSON.parse(localStorage.getItem("profile") || "null") || {};

const displayName =
    profile.name ||
    profile.full_name ||
    profile.fullname ||
    userData.full_name ||
    userData.fullname ||
    userData.name ||
    userData.username ||
    "User";

const displayRole =
    profile.role ||
    userData.role ||
    userData.user_type ||
    userData.account_type ||
    "User";

document.getElementById("profileInitial").textContent =
    displayName.trim().charAt(0).toUpperCase() || "U";

document.getElementById("profile-name").textContent = displayName;

document.getElementById("profile-role").textContent =
    String(displayRole)
        .replace(/_/g, " ")
        .replace(/\b\w/g, char => char.toUpperCase());
/* =========================================================
   MEMBER IDS
========================================================= */

// Membership API uses MEMBER ID e.g. M0012
const memberId =
    userData.user_id ||
    userData.member_id ||
    userData.id;

// Message API uses numeric user ID e.g. 73
const messageUserId =
    userData.id;

console.log(
    "MEMBERSHIP ID:",
    memberId
);

console.log(
    "MESSAGE USER ID:",
    messageUserId
);

/* =========================================================
   MEMBERSHIP
========================================================= */

async function loadMembership(){

    try{

        const response =
            await fetch(
                `${API_URL}/api/membership/${memberId}`
            );


        if(!response.ok){

            throw new Error(
                `Membership API error: ${response.status}`
            );

        }


        const result =
            await response.json();


        console.log(
            "MEMBERSHIP DATA:",
            result
        );


        const membership =
            result.data;


        const table =
            document.getElementById(
                "membership-body"
            );


        if(!membership){

            table.innerHTML = `
                <tr>
                    <td colspan="6"
                        style="text-align:center;">
                        No membership data found.
                    </td>
                </tr>
            `;

            return;

        }


        /* =========================
           TYPE
        ========================= */

        let type =
            membership.membership_type ||
            "N/A";


        type =
            type
                .replace("membership-", "")
                .toUpperCase();



        /* =========================
           MEMBERSHIP STATUS
        ========================= */

        const membershipStatus =
            membership.membership_status ||
            "N/A";


        const membershipStatusClass =
            membershipStatus === "ACTIVE"
                ? "status-green"
                : "status-red";



        /* =========================
           MONTHLY STATUS
        ========================= */

        const monthlyStatus =
            membership.monthly_status ||
            "N/A";


        const monthlyStatusClass =
            monthlyStatus === "PAID"
                ? "status-green"
                : "status-red";



        /* =========================
           FORMAT DATE
        ========================= */

        function formatMembershipDate(date){

            if(!date)
                return "-";


            const d =
                new Date(
                    date + "T00:00:00"
                );


            if(isNaN(d.getTime()))
                return date;


            return d.toLocaleDateString(
                "en-US",
                {
                    month: "long",
                    day: "numeric",
                    year: "numeric"
                }
            );

        }



        table.innerHTML = `

            <div class="membership-field">

                <span>Name</span>

                <strong>
                    ${membership.full_name || displayName}
                </strong>

            </div>


            <div class="membership-field">

                <span>Membership Type</span>

                <strong>
                    ${type}
                </strong>

            </div>


            <div class="membership-field">

                <span>Membership Validity</span>

                <strong>
                    ${formatMembershipDate(
                        membership.membership_validity
                    )}
                </strong>

            </div>


            <div class="membership-field">

                <span>Membership Status</span>

                <strong>

                    <span class="${
                        membershipStatus === "ACTIVE"
                            ? "status-badge active"
                            : "status-badge inactive"
                    }">

                        ${membershipStatus}

                    </span>

                </strong>

            </div>


            <div class="membership-field">

                <span>Monthly Validity</span>

                <strong>
                    ${formatMembershipDate(
                        membership.monthly_validity
                    )}
                </strong>

            </div>


            <div class="membership-field">

                <span>Monthly Status</span>

                <strong>

                    <span class="${
                        monthlyStatus === "PAID"
                            ? "status-badge active"
                            : "status-badge inactive"
                    }">

                        ${monthlyStatus}

                    </span>

                </strong>

            </div>

        `;


    }catch(error){

        console.error(
            "MEMBERSHIP ERROR:",
            error
        );


        document.getElementById(
            "membership-body"
        ).innerHTML = `

            <tr>

                <td colspan="6"
                    style="text-align:center;">

                    Unable to load membership data.

                </td>

            </tr>

        `;

    }

}




/* =========================================================
   NOTIFICATION POPUP
========================================================= */

let lastMessageCount = 0;
let firstMessageCheck = true;


async function checkMessageNotification(){

    try{

        const response =
            await fetch(
                `${API_URL}/api/messages_count/${messageUserId}`
            );


        if(!response.ok)
            return;


        const data =
            await response.json();


        const count =
            Number(data.count || 0);


        const badge =
            document.getElementById(
                "msg-count"
            );


        if(count > 0){

            badge.style.display =
                "flex";

            badge.innerText =
                count;

        }else{

            badge.style.display =
                "none";

        }


        if(firstMessageCheck){

            lastMessageCount =
                count;

            firstMessageCheck =
                false;

            return;

        }


        if(count > lastMessageCount){

            const newMessages =
                count -
                lastMessageCount;


            showNotifPopup(
                "New Message",
                newMessages === 1
                    ? "You received a new message."
                    : `You received ${newMessages} new messages.`
            );

        }


        lastMessageCount =
            count;


    }catch(error){

        console.error(
            "MESSAGE NOTIFICATION ERROR:",
            error
        );

    }

}



function showNotifPopup(
    title,
    text
){

    const popup =
        document.getElementById(
            "notifPopup"
        );


    document.getElementById(
        "notifTitle"
    ).innerText =
        title;


    document.getElementById(
        "notifText"
    ).innerText =
        text;


    popup.classList.add(
        "show"
    );


    setTimeout(
        () => {

            popup.classList.remove(
                "show"
            );

        },
        4000
    );

}



function goMessages(){

    window.location.href =
        "member_messages.html";

}



/* =========================================================
   DROPDOWN
========================================================= */

function toggleMenu(){

    const profile =
        document.querySelector(
            ".user-profile"
        );


    const dropdown =
        document.getElementById(
            "dropdown"
        );


    profile.classList.toggle(
        "active"
    );


    dropdown.classList.toggle(
        "show"
    );

}



window.onclick =
function(event){

    if(
        !event.target.closest(
            ".user-profile"
        )
    ){

        const profile =
            document.querySelector(
                ".user-profile"
            );


        const dropdown =
            document.getElementById(
                "dropdown"
            );


        profile.classList.remove(
            "active"
        );


        dropdown.classList.remove(
            "show"
        );

    }

};



/* =========================================================
   PASSWORD
========================================================= */

function togglePassword(
    inputId,
    button
){

    const input =
        document.getElementById(
            inputId
        );


    const icon =
        button.querySelector(
            "i"
        );


    if(
        input.type === "password"
    ){

        input.type =
            "text";


        icon.classList.remove(
            "fa-eye"
        );


        icon.classList.add(
            "fa-eye-slash"
        );

    }else{

        input.type =
            "password";


        icon.classList.remove(
            "fa-eye-slash"
        );


        icon.classList.add(
            "fa-eye"
        );

    }

}



function openChangePassword(){

    document.getElementById(
        "dropdown"
    ).classList.remove(
        "show"
    );


    document.querySelector(
        ".user-profile"
    ).classList.remove(
        "active"
    );


    document.getElementById(
        "changeCurrentPassword"
    ).value = "";


    document.getElementById(
        "changeNewPassword"
    ).value = "";


    document.getElementById(
        "changeConfirmPassword"
    ).value = "";


    document.getElementById(
        "changePasswordModal"
    ).classList.add(
        "show"
    );

}



function closeChangePassword(){

    document.getElementById(
        "changePasswordModal"
    ).classList.remove(
        "show"
    );

}



async function changePassword(){

    const currentPassword =
        document.getElementById(
            "changeCurrentPassword"
        ).value;


    const newPassword =
        document.getElementById(
            "changeNewPassword"
        ).value;


    const confirmPassword =
        document.getElementById(
            "changeConfirmPassword"
        ).value;


    if(!currentPassword){

        alert(
            "Enter your current password."
        );

        return;

    }


    if(!newPassword){

        alert(
            "Enter your new password."
        );

        return;

    }


    if(newPassword.length < 8){

        alert(
            "New password must be at least 8 characters."
        );

        return;

    }


    if(newPassword !== confirmPassword){

        alert(
            "New passwords do not match."
        );

        return;

    }


    try{

        const response =
            await fetch(
                `${API_URL}/api/change_password`,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        id:
                            userData.id,

                        username:
                            userData.username,

                        phone_number:
                            userData.phone_number,

                        current_password:
                            currentPassword,

                        new_password:
                            newPassword,

                        confirm_password:
                            confirmPassword

                    })

                }
            );


        const result =
            await response.json();


        if(
            !response.ok ||
            !result.success
        ){

            alert(
                result.message ||
                "Failed to change password."
            );

            return;

        }


        closeChangePassword();


        alert(
            "Password changed successfully."
        );


    }catch(error){

        console.error(
            "CHANGE PASSWORD ERROR:",
            error
        );


        alert(
            "Unable to connect to the server."
        );

    }

}



/* =========================================================
   LOGOUT
========================================================= */
function logout() {
    localStorage.removeItem("user");
    window.location.href = "index.html";
}

/* =========================================================
   INITIAL LOAD
========================================================= */
// ================= INITIAL LOAD =================

window.onload = async () => {
    const hasAccess = await checkMembershipPageAccess();

    if (!hasAccess) return;

    const memberId =
        userData.user_id ||
        userData.member_id ||
        userData.id;

    await loadMembership();

    checkMessageNotification();

    setInterval(checkMessageNotification, 3000);
};

</script>

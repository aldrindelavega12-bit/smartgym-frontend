<script>

const API_URL = "https://smartgym-api-ia2e.onrender.com";

// ================= MENU =================
const menu = document.getElementById("menu");

if(user.role === "admin"){
   menu.innerHTML = `
    <a href="admin.html">
        <i class="fa-solid fa-house"></i>
        Home
    </a>

    <a href="messages.html" class="msg-link">

        <i class="fa-solid fa-envelope"></i>

        Messages

        <span
            id="msg-count"
            class="msg-count">
            0
        </span>

    </a>

    <a href="attendance.html">
        <i class="fa-regular fa-calendar-check"></i>
        Attendance
    </a>

    <a href="locker.html">
        <i class="fa-solid fa-lock"></i>
        Locker
    </a>

    <a href="members.html">
        <i class="fa-solid fa-users"></i>
        Members
    </a>

    <a href="staff_manage.html">
        <i class="fa-regular fa-user"></i>
        Staff
    </a>

    <a href="create_account.html">
        <i class="fa-solid fa-user-plus"></i>
        Create Account
    </a>
`;
}else{
    menu.innerHTML = `
         <a href="staff.html">
            <i class="fa-solid fa-house"></i>
            Home
        </a>

        <a href="messages.html" class="msg-link">

            <i class="fa-solid fa-envelope"></i>

            Messages

            <span
                id="msg-count"
                class="msg-count">
                0
            </span>

        </a>

        <a href="attendance.html">
            <i class="fa-regular fa-calendar-check"></i>
            Attendance
        </a>

        <a href="locker.html">
            <i class="fa-solid fa-lock"></i>
            Locker
        </a>
    `;
}

// ================= SOCKET =================
const socket = io(API_URL, { transports: ["websocket"] });

// ⚠️ IMPORTANT FIX:
// Messages page is DISPLAY ONLY
// ❌ DO NOT SAVE HERE (to avoid duplicates / conflicts)

// ================= LOAD =================


// ================= LOAD ADMIN MESSAGES =================
async function loadMessages(){

    try{

        const res = await fetch(
            `${API_URL}/api/admin_messages`
        );

        const data = await res.json();

        currentMessages = data;

        const list =
            document.getElementById(
                "messages-list"
            );

        list.innerHTML = "";

        // NO DATA
        if(data.length === 0){

            list.innerHTML = `
                <li>No alerts</li>
            `;

            return;
        }

        // LOOP
        data.forEach(msg => {

            const unreadClass =
                msg.is_read == 0
                ? "unread"
                : "";

            const badge =
                msg.is_read == 0
                ? `<span class="unread-badge">
                        NEW
                </span>`
                : "";

            list.innerHTML += `

            <li class="msg-card ${unreadClass}"
                onclick="openMessage(${msg.id})">

                <div class="msg-header">

                    <b>${msg.title}</b>

                    ${badge}

                    <div class="msg-actions">

                        <i class="fa-solid fa-ellipsis-vertical"
                        onclick="
                        event.stopPropagation();
                        toggleMenu(${msg.id})
                        ">
                        </i>

                        <div
                            id="menu-${msg.id}"
                            class="msg-menu">

                            <button onclick="
                                event.stopPropagation();
                                markRead(${msg.id})
                                ">
                                Mark Read
                            </button>

                            <button onclick="
                                event.stopPropagation();
                                markUnread(${msg.id})
                                ">
                                Mark Unread
                            </button>

                            <button onclick="
                                event.stopPropagation();
                                deleteMessage(${msg.id})
                                ">
                                Delete
                            </button>

                        </div>

                    </div>

                </div>

                <p>${msg.message}</p>

                <small>${msg.created_at}</small>

            </li>
            `;
        });

    }catch(err){

        console.log(err);
    }
}


// ================= CLEAR =================
function clearMessages(){

    alert(
        "Database messages cannot be cleared here."
    );
}


// ================= INIT =================
loadMessages();

let currentMessages = [];

function openMessage(id){

    const msg =
        currentMessages.find(
            m => m.id == id
        );

    if(!msg) return;

    document.getElementById(
        "modalTitle"
    ).innerText = msg.title;

    document.getElementById(
        "modalMessage"
    ).innerText = msg.message;

    document.getElementById(
        "modalDate"
    ).innerText = msg.created_at;

    document.getElementById(
        "messageModal"
    ).style.display = "flex";

    markRead(id);
}

function closeMessage(){

    document.getElementById(
        "messageModal"
    ).style.display = "none";
}

async function markRead(id){

    await fetch(
        `${API_URL}/api/message_read/${id}`,
        {
            method:"POST"
        }
    );

    loadMessages();
}

async function deleteMessage(id){

    if(
        !confirm(
            "Delete this message?"
        )
    ) return;

    await fetch(
        `${API_URL}/api/delete_message/${id}`,
        {
            method:"DELETE"
        }
    );

    loadMessages();
}

document.addEventListener("click", () => {

    document
        .querySelectorAll(".msg-menu")
        .forEach(menu => {

            menu.classList.remove("show");
        });
});

async function markUnread(id){

    await fetch(
        `${API_URL}/api/message_unread/${id}`,
        {
            method:"POST"
        }
    );

    loadMessages();
}



function toggleMenu(id){

    event.stopPropagation();

    document
    .querySelectorAll(".msg-card")
    .forEach(card=>{
        card.classList.remove("menu-open");
    });

    const menu =
        document.getElementById(`menu-${id}`);

    const card =
        menu.closest(".msg-card");

    if(!menu.classList.contains("show")){
        card.classList.add("menu-open");
    }

    menu.classList.toggle("show");
}

async function loadMessageCount(){

    try{

        const res = await fetch(
            `${API_URL}/api/admin_messages`
        );

        const data = await res.json();

        const unread =
            data.filter(
                m => m.is_read == 0
            ).length;

        if(
            lastUnread !== 0 &&
            unread > lastUnread
        ){

            document
                .getElementById(
                    "notifSound"
                )
                ?.play();

            showNotifPopup(
                "New Message",
                `${unread - lastUnread} new notification`
            );
        }

        lastUnread = unread;

        const badge =
            document.getElementById(
                "msg-count"
            );

        if(!badge) return;

        if(unread > 0){

            badge.innerText =
                unread > 99
                ? "99+"
                : unread;

            badge.style.display =
                "flex";

        }else{

            badge.style.display =
                "none";
        }

    }catch(err){

        console.log(err);
    }
}

// ================= REALTIME =================
socket.on("new_message", () => {
    console.log("NEW MESSAGE RECEIVED");
    loadMessages();
    loadMessageCount();
});


socket.on("priority_alert", (data) => {
    console.log("PRIORITY ALERT RECEIVED", data);
    loadMessages();
    loadMessageCount();
});

let lastUnread = 0;

function showNotifPopup(title,text){

    const popup =
        document.getElementById(
            "notifPopup"
        );

    document.getElementById(
        "notifTitle"
    ).innerText = title;

    document.getElementById(
        "notifText"
    ).innerText = text;

    popup.classList.add("show");

    setTimeout(() => {

        popup.classList.remove(
            "show"
        );

    },4000);
}

// ================= SOCKET =================
socket.on("connect", () => {

    console.log(
        "Messages page connected"
    );
});
loadMessages();
loadMessageCount();

setInterval(
    loadMessageCount,
    3000
);


</script>

<script>
const API_URL = "https://smartgym-api-ia2e.onrender.com";

const MODULE_MENU = [
    {
        key: "dashboard",
        label: "Home",
        href: {
            pre_member: "pre_member.html",
            premember: "pre_member.html",
            member: "member.html",
            staff: "staff.html",
            trainer: "trainer.html",
            manager: "manager.html",
            admin: "admin.html"
        }
    },
    {
        key: "messages",
        label: "Messages",
        href: "messages.html",
        trainerHref: "trainer_messages.html",
        className: "msg-link"
    },
    { key: "program", label: "Program", href: "program.html" },
    { key: "get_program", label: "Get Program", href: "get_program.html" },
    { key: "book_locker", label: "Book Locker", href: "locker_booking.html" },
    { key: "membership", label: "Membership", href: "membership.html" },
    { key: "attendance", label: "Attendance", href: "attendance.html" },
    { key: "locker", label: "Locker", href: "locker.html", active: true },
    { key: "trainee", label: "Trainee", href: "trainer.html" },
    { key: "schedule", label: "Schedule", href: "trainer-schedule.html", trainerHref: "trainer-schedule.html" },
    { key: "client_requests", label: "Client Requests", href: "client_requests.html" },
    { key: "reports", label: "Reports", href: "reports.html" },
    { key: "members", label: "Members", href: "members.html" },
    { key: "walkins", label: "Walk-ins", href: "walkins.html" },
    { key: "archive", label: "Archive", href: "archive.html" },
    { key: "user_account_maintenance", label: "User Account Maintenance", href: "user_accounts.html" },
    { key: "backup_restore", label: "Backup & Restore", href: "backup_restore.html" },
    { key: "audit_logs", label: "Audit Logs", href: "audit_logs.html" }
];

function normalizeModuleKey(value) {
    const key = String(value || "")
        .trim()
        .toLowerCase()
        .replace(/[\s-]+/g, "_");

    const aliases = {
        home: "dashboard",
        trainee_schedule: "schedule",
        client_request: "client_requests",
        walk_in: "walkins",
        walk_in_management: "walkins",
        user_accounts: "user_account_maintenance",
        user_account: "user_account_maintenance",
        backup: "backup_restore",
        backup_and_restore: "backup_restore",
        audit_log: "audit_logs"
    };

    return aliases[key] || key;
}

function getLockerDashboardHref() {
    const role = String(user.role || user.user_type || "")
        .trim()
        .toLowerCase()
        .replace(/[\s-]+/g, "_");

    const dashboard = MODULE_MENU.find(item => item.key === "dashboard");

    return dashboard.href[role] || "index.html";
}

function renderLockerMenu(allowedModules) {
    const menu = document.getElementById("menu");
    if (!menu) return;

    menu.innerHTML = "";

    MODULE_MENU.forEach(item => {
        if (!allowedModules.has(item.key)) return;

        let href = typeof item.href === "object"
            ? item.href[String(user.role || "").toLowerCase()]
            : item.href;

        if (
            item.trainerHref &&
            String(user.role || "").toLowerCase() === "trainer"
        ) {
            href = item.trainerHref;
        }

        if (!href) return;

        const link = document.createElement("a");
        link.href = href;
        link.dataset.module = item.key;
        link.textContent = item.label;

        if (item.className) {
            link.classList.add(item.className);
        }

        if (item.active) {
            link.classList.add("active");
        }

        if (item.key === "messages") {
            const badge = document.createElement("span");
            badge.id = "msg-count";
            badge.className = "msg-count";
            badge.textContent = "0";
            link.appendChild(badge);
        }

        menu.appendChild(link);
    });
}

async function checkLockerPageAccess() {
    const userId = user.user_id || user.member_id || user.id;

    if (!userId) {
        window.location.href = "index.html";
        return false;
    }

    try {
        const response = await fetch(
            `${API_URL}/api/user/module-access/${encodeURIComponent(userId)}`,
            { cache: "no-store" }
        );

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        const modules = Array.isArray(data)
            ? data
            : (data.modules || []);

        const allowedModules = new Set(
            modules.map(item => {
                if (typeof item === "string") {
                    return normalizeModuleKey(item);
                }

                return normalizeModuleKey(
                    item.module_key ||
                    item.key ||
                    item.module_name ||
                    ""
                );
            })
        );

        renderLockerMenu(allowedModules);

        if (!allowedModules.has("locker")) {
            alert("You do not have permission to access this module.");
            window.location.href = getLockerDashboardHref();
            return false;
        }

        return true;

    } catch (error) {
        console.error("LOCKER ACCESS ERROR:", error);

        alert("Unable to verify module access. Please try again.");
        window.location.href = getLockerDashboardHref();

        return false;
    }
}

// ================= CURRENT =================
async function loadLockers(){
    try{
        const res = await fetch(`${API_URL}/api/lockers`);
        const result = await res.json();
        const data = result.data;

        const table = document.getElementById("locker-body");
        table.innerHTML = "";

        const today = new Date().toISOString().split("T")[0];

        const lockers = {
            1: { name: "-", status: "AVAILABLE", time_start: "-" },
            2: { name: "-", status: "AVAILABLE", time_start: "-" },
            3: { name: "-", status: "AVAILABLE", time_start: "-" }
        };

        data.forEach(lock => {

            lockers[lock.locker] = {
                name: lock.name || "-",
                status: lock.status || "AVAILABLE",
                time_start: lock.time_start || "-"
            };

        });

        for(let i=1; i<=3; i++){
            const l = lockers[i];

            table.innerHTML += `
                <tr>

                    <td>Locker ${i}</td>

                    <td>
                        ${l.name}
                    </td>

                    <td>
                        ${l.time_start}
                    </td>

                    <td class="${getColor(l.status)}">
                        ${formatStatus(l.status)}
                    </td>

                </tr>
            `;
        }

    }catch(err){
        console.error(err);
    }
}
async function loadMessageCount(){

    const res = await fetch(
        `${API_URL}/api/admin_messages`
    );

    const data = await res.json();

    const unread =
        data.filter(
            m => m.is_read == 0
        ).length;
    if(
        lastUnread !== 0 &&
        unread > lastUnread
    ){

        document
            .getElementById(
                "notifSound"
            )
            ?.play();

        showNotifPopup(
            "New Message",
            `${unread - lastUnread} new notification`
        );
    }

    lastUnread = unread;

    const badge =
        document.getElementById(
            "msg-count"
        );

    if(!badge) return;

    badge.innerText =
        unread > 99
        ? "99+"
        : unread;

    badge.style.display =
        unread > 0
        ? "flex"
        : "none";
}
// ================= HISTORY =================
async function loadHistory(){
    try{
        const date = document.getElementById("dateFilter").value;

        let url = `${API_URL}/api/locker_history`;
        if(date) url += `?date=${date}`;

        const res = await fetch(url);
        const result = await res.json();
        const data = result.data;

        const table = document.getElementById("history-body");
        table.innerHTML = "";

        if(!data || data.length === 0){
            table.innerHTML = `<tr><td colspan="4">No records</td></tr>`;
            return;
        }

        data.forEach(row => {
            table.innerHTML += `
                <tr>
                    <td>Locker ${row.locker}</td>
                    <td>${row.name}</td>
                    <td>${formatTime(row.start)}</td>
                    <td>${formatTime(row.end)}</td>
                </tr>
            `;
        });

    }catch(err){
        console.error(err);
    }
}

// ================= APPROVAL =================
async function loadApproval(){

    try{

        const res = await fetch(`${API_URL}/api/bookings`);

        const result = await res.json();

        console.log("DATA:", result);

        const data = result.data || [];
        console.log("FIRST:", data[0]);

        const table =
            document.getElementById("approval-body");

        const selectedStatus =
            document.getElementById("approvalStatus").value;

        const selectedDate =
            document.getElementById("approvalDate").value;

        table.innerHTML = "";

        // =========================
        // NO BOOKINGS
        // =========================
        if(data.length === 0){

            table.innerHTML = `
                <tr>
                    <td colspan="7">
                        No bookings
                    </td>
                </tr>
            `;

            return;
        }

        // =========================
        // LOOP BOOKINGS
        // =========================
        let found = false;
        data.forEach(b => {

            console.log(
                "COMPARE:",
                b.date,
                selectedDate
            );

            if(
                selectedStatus &&
                b.status !== selectedStatus
            ){
                return;
            }

            if(selectedDate){

                const bookingDate =
                    new Date(b.date)
                    .toISOString()
                    .split("T")[0];

                if(bookingDate !== selectedDate){
                    return;
                }
            }

           
            found = true;

            let actions = "";

            // =====================
            // PENDING
            // =====================
            if(b.status === "PENDING"){

                actions = `
                    <div class="booking-actions">

                        <button
                            type="button"
                            class="approve-btn"
                            onclick="approve(${b.id})"
                        >
                            <i class="fa-solid fa-check"></i>
                            Approve
                        </button>

                        <button
                            type="button"
                            class="decline-btn"
                            onclick="decline(${b.id})"
                        >
                            <i class="fa-solid fa-xmark"></i>
                            Decline
                        </button>

                    </div>
                `;
            }

            // =====================
            // APPROVED/DECLINED
            // =====================
            else{

                actions = b.status;
            }

            // =====================
            // SLOT FIX
            // =====================
            let slot = "-";

            if(b.start_time && b.end_time){

                const format12 = (time) => {

                    return new Date(
                        `1970-01-01T${time}`
                    ).toLocaleTimeString(
                        [],
                        {
                            hour: 'numeric',
                            minute: '2-digit',
                            hour12: true
                        }
                    );
                };

                slot =
                    `${format12(b.start_time)} - ${
                        format12(b.end_time)
                    }`;
            }

            // =====================
            // ROW
            // =====================
            table.innerHTML += `

                <tr>


                    <td>${b.user_id}</td>

                    <td>
                        Locker ${b.locker_number}
                    </td>

                    <td>
                        ${
                            new Date(b.date)
                            .toLocaleDateString("en-CA")
                        }
                    </td>

                    <td>${slot}</td>

                    <td>
                        <span class="status ${b.status}">
                            ${b.status}
                        </span>
                    </td>

                    <td>${actions}</td>

                </tr>
            `;
        });

        if(!found){

            table.innerHTML = `
                <tr>
                    <td colspan="7">
                        No bookings
                    </td>
                </tr>
            `;
        }

    }catch(err){

        console.error("LOAD APPROVAL ERROR:", err);
    }
}
async function approve(id){
    const user = JSON.parse(localStorage.getItem("user"));

    await fetch(`${API_URL}/api/update_booking`, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
            id: id,
            status: "APPROVED",
            sender_id: user.user_id
        })
    });

    loadApproval();
}

async function decline(id){
    const reason = prompt("Reason:");
    const user = JSON.parse(localStorage.getItem("user"));

    await fetch(`${API_URL}/api/update_booking`, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
            id: id,
            status: "REJECTED",
            reason: reason,
            sender_id: user.user_id
        })
    });

    loadApproval();
}

// ================= HELPERS =================
function getColor(status){

    if(status === "IN_USE")
        return "blue";

    if(status === "OVERTIME")
        return "red";

    if(status === "RESERVED")
        return "yellow";

    return "green";
}

function formatStatus(status){

    if(status === "IN_USE")
        return "🔵 IN USE";

    if(status === "OVERTIME")
        return "🔴 OVERTIME";

    if(status === "RESERVED")
        return "🟡 RESERVED";

    return "🟢 AVAILABLE";
}

function formatTime(dt){
    if(!dt || dt === "-") return "-";

    return new Date(dt).toLocaleString([], {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
    });
}

window.onload = async () => {
    const hasAccess = await checkLockerPageAccess();

    if (!hasAccess) return;

    const now = new Date();

    const today =
        `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;

    document.getElementById("dateFilter").value = today;
    document.getElementById("approvalDate").value = today;

    loadLockers();

    if (document.querySelector('#menu a[data-module="messages"]')) {
        loadMessageCount();
    }
};
const lockerTabs = document.querySelectorAll(".locker-tab");

const lockerViews = {
    "current-view": document.getElementById("current-view"),
    "history-view": document.getElementById("history-view"),
    "approval-view": document.getElementById("approval-view")
};

lockerTabs.forEach(tab => {

    tab.addEventListener("click", function () {

        // Remove active from all tabs
        lockerTabs.forEach(t => {
            t.classList.remove("active");
        });

        // Add active to clicked tab
        this.classList.add("active");

        // Hide all views
        Object.values(lockerViews).forEach(view => {

            if (view) {
                view.style.display = "none";
            }

        });


        // =========================
        // SHOW SELECTED VIEW
        // =========================

        const selectedView =
            lockerViews[this.dataset.view];

        if (selectedView) {
            selectedView.style.display = "block";
        }


        // =========================
        // CURRENT
        // =========================

        if(this.dataset.view === "current-view"){

            loadLockers();

        }


        // =========================
        // HISTORY
        // =========================

        if(this.dataset.view === "history-view"){

            const dateFilter =
                document.getElementById("dateFilter");

            // Automatically set TODAY
            if(!dateFilter.value){

                const now = new Date();

                const today =
                    `${now.getFullYear()}-${
                        String(now.getMonth() + 1).padStart(2, "0")
                    }-${
                        String(now.getDate()).padStart(2, "0")
                    }`;

                dateFilter.value = today;

            }

            // AUTOMATICALLY LOAD
            loadHistory();

        }


        // =========================
        // REQUESTS
        // =========================

        if(this.dataset.view === "approval-view"){

            const approvalDate =
                document.getElementById("approvalDate");

            // Automatically set TODAY
            if(!approvalDate.value){

                const now = new Date();

                const today =
                    `${now.getFullYear()}-${
                        String(now.getMonth() + 1).padStart(2, "0")
                    }-${
                        String(now.getDate()).padStart(2, "0")
                    }`;

                approvalDate.value = today;

            }

            // AUTOMATICALLY LOAD
            loadApproval();

        }

    });

});

// ================= STAFF PROFILE DROPDOWN =================

function toggleStaffMenu() {

    const profile =
        document.querySelector(".staff-profile");

    const dropdown =
        document.getElementById("staffDropdown");

    if (!profile || !dropdown) return;

    profile.classList.toggle("active");

    dropdown.classList.toggle("show");
}


// ================= CLOSE DROPDOWN =================

window.addEventListener("click", function(e) {

    if (!e.target.closest(".staff-profile")) {

        const profile =
            document.querySelector(".staff-profile");

        const dropdown =
            document.getElementById("staffDropdown");

        if (profile) {
            profile.classList.remove("active");
        }

        if (dropdown) {
            dropdown.classList.remove("show");
        }

    }

});


// ================= LOGOUT =================
function logout() {
    localStorage.removeItem("user");
    window.location.href = "index.html";
}

// fallback refresh
setInterval(() => {
    if (document.body.dataset.module === "locker") {
        loadLockers();
    }
}, 10000);
socket.on("new_message", () => {

    loadMessages();
    loadMessageCount();
});

socket.on("priority_alert", () => {

    loadMessages();
    loadMessageCount();
});

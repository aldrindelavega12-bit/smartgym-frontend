<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Logs | Smart Gym</title>

    <link rel="stylesheet" href="css/admin-dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        .audit-page {
            width: 100%;
            color: #26332f;
            font-family: 'Inter', sans-serif;
        }

        /* PAGE HEADER */
        .audit-page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 22px;
        }

        .audit-page-title h1 {
            margin: 0;
            font-size: 32px;
            line-height: 1.1;
            font-weight: 800;
            color: #111;
        }

        .audit-page-title p {
            margin: 6px 0 0;
            color: #61716b;
            font-size: 14px;
        }

        /* SEARCH, FILTER AND DATE */
        .audit-toolbar {
            display: grid !important;
            grid-template-columns: 70fr 10fr 20fr !important;
            gap: 10px !important;
            align-items: center !important;
            width: 100% !important;
            margin: 0 0 16px !important;
            padding: 0 !important;
            box-sizing: border-box !important;
            border: none !important;
            background: transparent !important;
        }

        .audit-search,
        .audit-filter,
        .audit-date {
            display: block !important;
            width: 100% !important;
            min-width: 0 !important;
            height: 48px !important;
            box-sizing: border-box !important;
            border: 1px solid #d9e3e9 !important;
            border-radius: 11px !important;
            background: #fff !important;
            font-family: 'Inter', sans-serif !important;
            font-size: 14px !important;
        }

        .audit-search {
            display: flex !important;
            align-items: center !important;
            gap: 12px !important;
            padding: 0 16px !important;
        }

        .audit-search i {
            color: #526680 !important;
            flex-shrink: 0 !important;
            font-size: 16px !important;
        }

        .audit-search input {
            display: block !important;
            width: 100% !important;
            min-width: 0 !important;
            height: auto !important;
            padding: 0 !important;
            border: none !important;
            outline: none !important;
            background: transparent !important;
            color: #344563 !important;
            font-family: 'Inter', sans-serif !important;
            font-size: 14px !important;
            box-shadow: none !important;
        }

        .audit-search input::placeholder {
            color: #8793a6 !important;
            opacity: 1 !important;
        }

        .audit-filter {
            padding: 0 12px !important;
            color: #26332f !important;
            cursor: pointer !important;
        }

        .audit-date {
            padding: 0 12px !important;
            color: #526680 !important;
            cursor: pointer !important;
        }

        .audit-search:focus-within,
        .audit-filter:focus,
        .audit-date:focus {
            border-color: #009650 !important;
            outline: none !important;
        }

        /* TABLE CARD */
        .audit-card {
            width: 100%;
            margin: 0;
            background: #fff;
            border: 1px solid #e3e9e6;
            border-radius: 13px;
            box-shadow: 0 5px 16px rgba(0, 0, 0, 0.03);
            overflow: hidden;
        }

        .audit-table-wrapper {
            display: block !important;
            width: 100%;
            padding: 16px 16px 0;
            box-sizing: border-box;
            overflow-x: auto;
        }

        .audit-table {
            width: 100%;
            min-width: 760px;
            table-layout: fixed;
            border-collapse: collapse;
        }

        .audit-table thead {
            display: table-header-group !important;
            background: #edf7f2;
        }

        .audit-table th {
            padding: 12px 17px;
            text-align: left;
            color: #17211b;
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            border: none;
            text-transform: none;
            letter-spacing: 0;
        }

        .audit-table th:first-child {
            border-radius: 5px 0 0 5px;
        }

        .audit-table th:last-child {
            border-radius: 0 5px 5px 0;
        }

        .audit-table td {
            padding: 11px 17px;
            color: #506181;
            font-size: 14px;
            line-height: 1.45;
            border-bottom: 1px solid #e7edf1;
            vertical-align: middle;
            overflow-wrap: anywhere;
        }

        .audit-table tbody tr:hover {
            background: #f9fcfa;
        }

        .audit-table tbody tr:last-child td {
            border-bottom: none;
        }

        .audit-table th:nth-child(1),
        .audit-table td:nth-child(1) {
            width: 17%;
        }

        .audit-table th:nth-child(2),
        .audit-table td:nth-child(2) {
            width: 13%;
        }

        .audit-table th:nth-child(3),
        .audit-table td:nth-child(3) {
            width: 12%;
        }

        .audit-table th:nth-child(4),
        .audit-table td:nth-child(4) {
            width: 42%;
        }

        .audit-table th:nth-child(5),
        .audit-table td:nth-child(5) {
            width: 16%;
            white-space: nowrap;
        }

        /* TABLE FOOTER */
        .audit-table-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            min-height: 70px;
            padding: 12px 22px;
            border-top: 1px solid #e8efeb;
            box-sizing: border-box;
        }

        .audit-results-info {
            color: #506181;
            font-size: 14px;
        }

        .audit-pagination {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 7px;
            flex-wrap: wrap;
        }

        .audit-page-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 43px;
            height: 43px;
            padding: 0 12px;
            border: 1px solid #dce5ed;
            border-radius: 9px;
            background: #fff;
            color: #506181;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
        }

        .audit-page-btn:hover:not(:disabled) {
            border-color: #009650;
            color: #008f4c;
        }

        .audit-page-btn.active {
            background: #009650;
            border-color: #009650;
            color: #fff;
        }

        .audit-page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .audit-page-ellipsis {
            padding: 0 5px;
            color: #506181;
            font-size: 14px;
        }

        .audit-empty-row td {
            height: 180px;
            text-align: center;
            color: #81909a;
        }

        @media (max-width: 900px) {
            .audit-toolbar {
                grid-template-columns: 1fr 1fr !important;
            }

            .audit-date {
                grid-column: 1 / -1;
            }
        }

        @media (max-width: 650px) {
            .audit-page-title h1 {
                font-size: 27px;
            }

            .audit-toolbar {
                grid-template-columns: 1fr !important;
            }

            .audit-date {
                grid-column: auto;
            }

            .audit-table-footer {
                align-items: flex-start;
                flex-direction: column;
                padding: 14px;
            }

            .audit-pagination {
                justify-content: flex-start;
            }

            .audit-page-btn {
                min-width: 35px;
                height: 36px;
            }
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->
    <div class="navbar">
        <div class="brand">
            <div class="brand-text">
                <strong>SMART GYM</strong>
                <span>STRONGER PEOPLE • A HEALTHIER TOMORROW</span>
            </div>
        </div>

        <div class="menu">
            <a href="admin.html">Home</a>
            <a href="user_accounts.html">User Account Maintenance</a>
            <a href="backup_restore.html">Backup &amp; Restore</a>
            <a href="audit_logs.html" class="active">Audit Logs</a>
        </div>
    </div>

    <!-- MAIN LAYOUT -->
    <div class="layout">
        <div class="main">

            <!-- TOP HEADER -->
            <div class="top-header">
                <div class="top-right">
                    <div
                        class="staff-profile"
                        id="staffProfile"
                        onclick="toggleStaffMenu(event)"
                    >
                        <div class="staff-avatar">A</div>

                        <div class="staff-info">
                            <strong>Admin</strong>
                            <small>Administrator</small>
                        </div>

                        <i class="fa-solid fa-chevron-down staff-profile-chevron"></i>

                        <div id="staffDropdown" class="staff-profile-dropdown">
                            <button
                                type="button"
                                onclick="logout(event)"
                                class="staff-dropdown-logout"
                            >
                                <i class="fa-solid fa-right-from-bracket"></i>
                                Log Out
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <main class="audit-page">

                <!-- PAGE HEADER -->
                <div class="audit-page-header">
                    <div class="audit-page-title">
                        <h1>Audit Logs</h1>
                        <p>Monitor and review administrative activities in the Smart Gym system.</p>
                    </div>
                </div>

                <!-- SEARCH, FILTER AND DATE -->
                <div class="audit-toolbar">
                    <label class="audit-search">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input
                            type="search"
                            id="auditSearch"
                            placeholder="Search user, action, details..."
                            autocomplete="off"
                        >
                    </label>

                    <select
                        class="audit-filter"
                        id="actionFilter"
                        aria-label="Filter by type"
                    >
                        <option value="all">All Types</option>
                        <option value="created">Created</option>
                        <option value="added">Added</option>
                        <option value="updated">Updated</option>
                        <option value="deleted">Deleted</option>
                        <option value="archived">Archived</option>
                        <option value="restored">Restored</option>
                        <option value="backup">Backup</option>
                        <option value="login">Login</option>
                        <option value="settings">Settings</option>
                    </select>

                    <input
                        type="date"
                        class="audit-date"
                        id="dateFilter"
                        aria-label="Select date"
                    >
                </div>

                <!-- AUDIT TABLE -->
                <section class="audit-card">
                    <div class="audit-table-wrapper">
                        <table class="audit-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Role</th>
                                    <th>Action</th>
                                    <th>Details</th>
                                    <th>Date</th>
                                </tr>
                            </thead>
                            <tbody id="auditTableBody"></tbody>
                        </table>
                    </div>

                    <div class="audit-table-footer">
                        <div class="audit-results-info" id="auditResultsInfo">
                            Showing 0 logs
                        </div>
                        <div class="audit-pagination" id="auditPagination"></div>
                    </div>
                </section>

            </main>
        </div>
    </div>

    <script>
        const PAGE_SIZE = 10;

        /*
         * HARDCODED SAMPLE DATA
         * Petsa ay naka-base sa kasalukuyang local date ng browser.
         * Sample records lamang ito para makita at masubukan ang table.
         */
        function getLocalDateOffset(daysAgo) {
            const date = new Date();
            date.setDate(date.getDate() - daysAgo);

            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const day = String(date.getDate()).padStart(2, "0");

            return `${year}-${month}-${day}`;
        }

        const auditRecords = [
            {
                user_name: "Aldrin Dela Cruz",
                role: "Admin",
                action: "Created",
                details: "Created staff account for Juan Santos (S0005)",
                date: getLocalDateOffset(0)
            },
            {
                user_name: "Maria Reyes",
                role: "Manager",
                action: "Updated",
                details: "Updated member information (M0015)",
                date: getLocalDateOffset(0)
            },
            {
                user_name: "Juan Santos",
                role: "Staff",
                action: "Added",
                details: "Added new walk-in record (W0021)",
                date: getLocalDateOffset(0)
            },
            {
                user_name: "Aldrin Dela Cruz",
                role: "Admin",
                action: "Backup",
                details: "Created database backup",
                date: getLocalDateOffset(0)
            },
            {
                user_name: "Carlos Reyes",
                role: "Manager",
                action: "Archived",
                details: "Archived member (M0012)",
                date: getLocalDateOffset(1)
            },
            {
                user_name: "Mark Santos",
                role: "Staff",
                action: "Deleted",
                details: "Deleted locker booking (LKB0015)",
                date: getLocalDateOffset(1)
            },
            {
                user_name: "Ana Lim",
                role: "Manager",
                action: "Updated",
                details: "Updated staff information (S0003)",
                date: getLocalDateOffset(1)
            },
            {
                user_name: "Mark Santos",
                role: "Staff",
                action: "Login",
                details: "User logged in",
                date: getLocalDateOffset(1)
            },
            {
                user_name: "Aldrin Dela Cruz",
                role: "Admin",
                action: "Settings",
                details: "Updated system settings (attendance)",
                date: getLocalDateOffset(2)
            },
            {
                user_name: "Maria Reyes",
                role: "Manager",
                action: "Restored",
                details: "Restored archived member (M0008)",
                date: getLocalDateOffset(2)
            },
            {
                user_name: "Aldrin Dela Cruz",
                role: "Admin",
                action: "Login",
                details: "Administrator logged in",
                date: getLocalDateOffset(2)
            },
            {
                user_name: "Juan Santos",
                role: "Staff",
                action: "Created",
                details: "Created a new walk-in transaction (W0022)",
                date: getLocalDateOffset(3)
            },
            {
                user_name: "Ana Lim",
                role: "Manager",
                action: "Added",
                details: "Added a new member record (M0016)",
                date: getLocalDateOffset(3)
            },
            {
                user_name: "Mark Santos",
                role: "Staff",
                action: "Updated",
                details: "Updated locker booking information (LKB0016)",
                date: getLocalDateOffset(4)
            },
            {
                user_name: "Aldrin Dela Cruz",
                role: "Admin",
                action: "Deleted",
                details: "Deleted an inactive user account (U0014)",
                date: getLocalDateOffset(4)
            },
            {
                user_name: "Maria Reyes",
                role: "Manager",
                action: "Archived",
                details: "Archived inactive member (M0009)",
                date: getLocalDateOffset(5)
            },
            {
                user_name: "Carlos Reyes",
                role: "Manager",
                action: "Login",
                details: "User logged in",
                date: getLocalDateOffset(5)
            },
            {
                user_name: "Aldrin Dela Cruz",
                role: "Admin",
                action: "Backup",
                details: "Completed database backup",
                date: getLocalDateOffset(6)
            },
            {
                user_name: "Ana Lim",
                role: "Manager",
                action: "Restored",
                details: "Restored archived member (M0010)",
                date: getLocalDateOffset(7)
            },
            {
                user_name: "Juan Santos",
                role: "Staff",
                action: "Settings",
                details: "Updated attendance-related settings",
                date: getLocalDateOffset(8)
            },
            {
                user_name: "Mark Santos",
                role: "Staff",
                action: "Added",
                details: "Added a new walk-in record (W0023)",
                date: getLocalDateOffset(9)
            },
            {
                user_name: "Maria Reyes",
                role: "Manager",
                action: "Updated",
                details: "Updated member contact information (M0011)",
                date: getLocalDateOffset(10)
            }
        ];

        let filteredRecords = [...auditRecords];
        let currentPage = 1;

        const searchInput = document.getElementById("auditSearch");
        const actionFilter = document.getElementById("actionFilter");
        const dateFilter = document.getElementById("dateFilter");
        const tableBody = document.getElementById("auditTableBody");
        const pagination = document.getElementById("auditPagination");
        const resultsInfo = document.getElementById("auditResultsInfo");

        function escapeHTML(value) {
            return String(value ?? "").replace(/[&<>"']/g, character => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            })[character]);
        }

        function formatDate(dateString) {
            if (!dateString) return "—";

            const parts = dateString.split("-");
            if (parts.length !== 3) return dateString;

            const date = new Date(
                Number(parts[0]),
                Number(parts[1]) - 1,
                Number(parts[2])
            );

            return date.toLocaleDateString("en-US", {
                month: "short",
                day: "2-digit",
                year: "numeric"
            });
        }

        function normalizeAction(action) {
            const value = String(action || "").toLowerCase();

            if (value.includes("login") || value.includes("logout")) {
                return "login";
            }
            if (value.includes("create") || value.includes("register")) {
                return "created";
            }
            if (value.includes("add")) {
                return "added";
            }
            if (value.includes("update") || value.includes("edit")) {
                return "updated";
            }
            if (value.includes("delete") || value.includes("remove")) {
                return "deleted";
            }
            if (value.includes("archive")) {
                return "archived";
            }
            if (value.includes("restore")) {
                return "restored";
            }
            if (value.includes("backup")) {
                return "backup";
            }
            if (value.includes("setting")) {
                return "settings";
            }

            return value;
        }

        function applyFilters() {
            const query = searchInput.value.trim().toLowerCase();
            const selectedAction = actionFilter.value;
            const selectedDate = dateFilter.value;

            filteredRecords = auditRecords.filter(record => {
                const searchable = [
                    record.user_name,
                    record.role,
                    record.action,
                    record.details,
                    formatDate(record.date)
                ].join(" ").toLowerCase();

                const matchesSearch =
                    !query || searchable.includes(query);

                const matchesAction =
                    selectedAction === "all" ||
                    normalizeAction(record.action) === selectedAction;

                const matchesDate =
                    !selectedDate || record.date === selectedDate;

                return matchesSearch && matchesAction && matchesDate;
            });

            currentPage = 1;
            renderTable();
        }

        function renderTable() {
            const total = filteredRecords.length;
            const totalPages = Math.ceil(total / PAGE_SIZE);
            const start = (currentPage - 1) * PAGE_SIZE;

            const pageRecords = filteredRecords.slice(
                start,
                start + PAGE_SIZE
            );

            if (pageRecords.length > 0) {
                tableBody.innerHTML = pageRecords.map(record => `
                    <tr>
                        <td>${escapeHTML(record.user_name)}</td>
                        <td>${escapeHTML(record.role)}</td>
                        <td>${escapeHTML(record.action)}</td>
                        <td>${escapeHTML(record.details)}</td>
                        <td>${escapeHTML(formatDate(record.date))}</td>
                    </tr>
                `).join("");
            } else {
                tableBody.innerHTML = `
                    <tr class="audit-empty-row">
                        <td colspan="5">No audit records match your filters.</td>
                    </tr>
                `;
            }

            resultsInfo.textContent = total === 0
                ? "Showing 0 logs"
                : `Showing ${start + 1} to ${Math.min(start + PAGE_SIZE, total)} of ${total} logs`;

            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            pagination.innerHTML = "";

            if (totalPages <= 1) return;

            function addButton(label, page, active = false, disabled = false) {
                const button = document.createElement("button");

                button.type = "button";
                button.className =
                    "audit-page-btn" + (active ? " active" : "");
                button.textContent = label;
                button.disabled = disabled;

                button.addEventListener("click", () => {
                    currentPage = page;
                    renderTable();
                });

                pagination.appendChild(button);
            }

            addButton(
                "‹",
                Math.max(1, currentPage - 1),
                false,
                currentPage === 1
            );

            let pages = [];

            if (totalPages <= 6) {
                pages = Array.from(
                    { length: totalPages },
                    (_, index) => index + 1
                );
            } else if (currentPage <= 3) {
                pages = [1, 2, 3, 4, 5, "...", totalPages];
            } else if (currentPage >= totalPages - 2) {
                pages = [
                    1, "...",
                    totalPages - 4,
                    totalPages - 3,
                    totalPages - 2,
                    totalPages - 1,
                    totalPages
                ];
            } else {
                pages = [
                    1, "...",
                    currentPage - 1,
                    currentPage,
                    currentPage + 1,
                    "...",
                    totalPages
                ];
            }

            pages.forEach(page => {
                if (page === "...") {
                    const span = document.createElement("span");
                    span.className = "audit-page-ellipsis";
                    span.textContent = "...";
                    pagination.appendChild(span);
                } else {
                    addButton(
                        String(page),
                        page,
                        page === currentPage
                    );
                }
            });

            addButton(
                "›",
                Math.min(totalPages, currentPage + 1),
                false,
                currentPage === totalPages
            );
        }

        searchInput.addEventListener("input", applyFilters);
        actionFilter.addEventListener("change", applyFilters);
        dateFilter.addEventListener("change", applyFilters);

        function toggleStaffMenu(event) {
            if (event) event.stopPropagation();

            document
                .getElementById("staffDropdown")
                .classList.toggle("show");
        }

        document.addEventListener("click", event => {
            const profile = document.getElementById("staffProfile");
            const dropdown = document.getElementById("staffDropdown");

            if (profile && !profile.contains(event.target)) {
                dropdown.classList.remove("show");
            }
        });

        function logout(event) {
            if (event) event.stopPropagation();
            window.location.href = "login.html";
        }

        // Default date: today. Clear it if you want to view all dates.
        dateFilter.value = getLocalDateOffset(0);

        // Render the hardcoded sample records immediately.
        applyFilters();
    </script>

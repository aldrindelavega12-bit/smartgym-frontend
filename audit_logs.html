<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Logs | Smart Gym</title>

    <link rel="stylesheet" href="css/admin-dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        .audit-page {
            width: 100%;
            color: #26332f;
            font-family: 'Inter', sans-serif;
        }

        /* PAGE HEADER */
        .audit-page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 22px;
        }

        .audit-page-title h1 {
            margin: 0;
            font-size: 32px;
            line-height: 1.1;
            font-weight: 800;
            color: #111;
        }

        .audit-page-title p {
            margin: 6px 0 0;
            color: #61716b;
            font-size: 14px;
        }

        /* SEARCH, FILTER AND DATE */
        .audit-toolbar {
            display: grid !important;
            grid-template-columns: 70fr 10fr 20fr !important;
            gap: 10px !important;
            align-items: center !important;
            width: 100% !important;
            margin: 0 0 16px !important;
            padding: 0 !important;
            box-sizing: border-box !important;
            border: none !important;
            background: transparent !important;
        }

        .audit-search,
        .audit-filter,
        .audit-date {
            display: block !important;
            width: 100% !important;
            min-width: 0 !important;
            height: 48px !important;
            box-sizing: border-box !important;
            border: 1px solid #d9e3e9 !important;
            border-radius: 11px !important;
            background: #fff !important;
            font-family: 'Inter', sans-serif !important;
            font-size: 14px !important;
        }

        .audit-search {
            display: flex !important;
            align-items: center !important;
            gap: 12px !important;
            padding: 0 16px !important;
        }

        .audit-search i {
            color: #526680 !important;
            flex-shrink: 0 !important;
            font-size: 16px !important;
        }

        .audit-search input {
            display: block !important;
            width: 100% !important;
            min-width: 0 !important;
            height: auto !important;
            padding: 0 !important;
            border: none !important;
            outline: none !important;
            background: transparent !important;
            color: #344563 !important;
            font-family: 'Inter', sans-serif !important;
            font-size: 14px !important;
            box-shadow: none !important;
        }

        .audit-search input::placeholder {
            color: #8793a6 !important;
            opacity: 1 !important;
        }

        .audit-filter {
            padding: 0 12px !important;
            color: #26332f !important;
            cursor: pointer !important;
        }

        .audit-date {
            padding: 0 12px !important;
            color: #526680 !important;
            cursor: pointer !important;
        }

        .audit-search:focus-within,
        .audit-filter:focus,
        .audit-date:focus {
            border-color: #009650 !important;
            outline: none !important;
        }

        /* TABLE CARD */
        .audit-card {
            width: 100%;
            margin: 0;
            background: #fff;
            border: 1px solid #e3e9e6;
            border-radius: 13px;
            box-shadow: 0 5px 16px rgba(0, 0, 0, 0.03);
            overflow: hidden;
        }

        .audit-table-wrapper {
            display: block !important;
            width: 100%;
            padding: 16px 16px 0;
            box-sizing: border-box;
            overflow-x: auto;
        }

        .audit-table {
            width: 100%;
            min-width: 760px;
            table-layout: fixed;
            border-collapse: collapse;
        }

        .audit-table thead {
            display: table-header-group !important;
            background: #edf7f2;
        }

        .audit-table th {
            padding: 12px 17px;
            text-align: left;
            color: #17211b;
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            border: none;
            text-transform: none;
            letter-spacing: 0;
        }

        .audit-table th:first-child {
            border-radius: 5px 0 0 5px;
        }

        .audit-table th:last-child {
            border-radius: 0 5px 5px 0;
        }

        .audit-table td {
            padding: 11px 17px;
            color: #506181;
            font-size: 14px;
            line-height: 1.45;
            border-bottom: 1px solid #e7edf1;
            vertical-align: middle;
            overflow-wrap: anywhere;
        }

        .audit-table tbody tr:hover {
            background: #f9fcfa;
        }

        .audit-table tbody tr:last-child td {
            border-bottom: none;
        }

        .audit-table th:nth-child(1),
        .audit-table td:nth-child(1) {
            width: 17%;
        }

        .audit-table th:nth-child(2),
        .audit-table td:nth-child(2) {
            width: 13%;
        }

        .audit-table th:nth-child(3),
        .audit-table td:nth-child(3) {
            width: 12%;
        }

        .audit-table th:nth-child(4),
        .audit-table td:nth-child(4) {
            width: 42%;
        }

        .audit-table th:nth-child(5),
        .audit-table td:nth-child(5) {
            width: 16%;
            white-space: nowrap;
        }

        /* TABLE FOOTER */
        .audit-table-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            min-height: 70px;
            padding: 12px 22px;
            border-top: 1px solid #e8efeb;
            box-sizing: border-box;
        }

        .audit-results-info {
            color: #506181;
            font-size: 14px;
        }

        .audit-pagination {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 7px;
            flex-wrap: wrap;
        }

        .audit-page-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 43px;
            height: 43px;
            padding: 0 12px;
            border: 1px solid #dce5ed;
            border-radius: 9px;
            background: #fff;
            color: #506181;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
        }

        .audit-page-btn:hover:not(:disabled) {
            border-color: #009650;
            color: #008f4c;
        }

        .audit-page-btn.active {
            background: #009650;
            border-color: #009650;
            color: #fff;
        }

        .audit-page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .audit-page-ellipsis {
            padding: 0 5px;
            color: #506181;
            font-size: 14px;
        }

        .audit-empty-row td {
            height: 180px;
            text-align: center;
            color: #81909a;
        }

        @media (max-width: 900px) {
            .audit-toolbar {
                grid-template-columns: 1fr 1fr !important;
            }

            .audit-date {
                grid-column: 1 / -1;
            }
        }

        @media (max-width: 650px) {
            .audit-page-title h1 {
                font-size: 27px;
            }

            .audit-toolbar {
                grid-template-columns: 1fr !important;
            }

            .audit-date {
                grid-column: auto;
            }

            .audit-table-footer {
                align-items: flex-start;
                flex-direction: column;
                padding: 14px;
            }

            .audit-pagination {
                justify-content: flex-start;
            }

            .audit-page-btn {
                min-width: 35px;
                height: 36px;
            }
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->
    <div class="navbar">
        <div class="brand">
            <div class="brand-text">
                <strong>SMART GYM</strong>
                <span>STRONGER PEOPLE • A HEALTHIER TOMORROW</span>
            </div>
        </div>

        <div class="menu" id="menu"></div>
    </div>

    <!-- MAIN LAYOUT -->
    <div class="layout">
        <div class="main">

            <!-- TOP HEADER -->
            <div class="top-header">
                <div class="top-right">
                    <div
                        class="staff-profile"
                        id="staffProfile"
                        onclick="toggleStaffMenu(event)"
                    >

                        <div class="staff-avatar" id="profileInitial">U</div>

                        <div class="staff-info">
                            <strong id="profileName">User</strong>
                            <small id="profileRole">User</small>
                        </div>

                        <i class="fa-solid fa-chevron-down staff-profile-chevron"></i>

                        <div id="staffDropdown" class="staff-profile-dropdown">
                            <button
                                type="button"
                                onclick="logout(event)"
                                class="staff-dropdown-logout"
                            >
                                <i class="fa-solid fa-right-from-bracket"></i>
                                Log Out
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <main class="audit-page">

                <!-- PAGE HEADER -->
                <div class="audit-page-header">
                    <div class="audit-page-title">
                        <h1>Audit Logs</h1>
                        <p>Monitor and review administrative activities in the Smart Gym system.</p>
                    </div>
                </div>

                <!-- SEARCH, FILTER AND DATE -->
                <div class="audit-toolbar">
                    <label class="audit-search">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input
                            type="search"
                            id="auditSearch"
                            placeholder="Search user, action, details..."
                            autocomplete="off"
                        >
                    </label>

                    <select
                        class="audit-filter"
                        id="actionFilter"
                        aria-label="Filter by type"
                    >
                        <option value="all">All Types</option>
                        <option value="created">Create</option>
                        <option value="deleted">Delete</option>
                        <option value="archived">Archive</option>
                        <option value="restored">Restore</option>
                        <option value="payment">Payment</option>

                    </select>

                    <input
                        type="date"
                        class="audit-date"
                        id="dateFilter"
                        aria-label="Select date"
                    >
                </div>

                <!-- AUDIT TABLE -->
                <section class="audit-card">
                    <div class="audit-table-wrapper">
                        <table class="audit-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Role</th>
                                    <th>Action</th>
                                    <th>Details</th>
                                    <th>Date</th>
                                </tr>
                            </thead>
                            <tbody id="auditTableBody"></tbody>
                        </table>
                    </div>

                    <div class="audit-table-footer">
                        <div class="audit-results-info" id="auditResultsInfo">
                            Showing 0 logs
                        </div>
                        <div class="audit-pagination" id="auditPagination"></div>
                    </div>
                </section>

            </main>
        </div>
    </div>

 

<script>
    const PAGE_SIZE = 10;
    const AUDIT_API_URL =
        "https://smartgym-api-ia2e.onrender.com/api/audit-logs";

    
    /* =====================================================
    USER SESSION
    ===================================================== */

    const user = JSON.parse(localStorage.getItem("user") || "null");

    const API_URL = "https://smartgym-api-ia2e.onrender.com";


    /* =====================================================
    MASTER MODULE MENU
    ===================================================== */

    const MODULE_MENU = [
        {
            key: "dashboard",
            label: "Home",
            href: {
                pre_member: "pre_member.html",
                premember: "pre_member.html",
                member: "member.html",
                staff: "staff.html",
                front_desk: "staff.html",
                trainer: "trainer.html",
                manager: "manager.html",
                admin: "admin.html"
            }
        },
        {
            key: "messages",
            label: "Messages",
            href: "messages.html",
            trainerHref: "trainer_messages.html"
        },
        { key: "program", label: "Program", href: "program.html" },
        { key: "get_program", label: "Get Program", href: "get_program.html" },
        { key: "book_locker", label: "Book Locker", href: "locker_booking.html" },
        { key: "membership", label: "Membership", href: "membership.html" },
        { key: "attendance", label: "Attendance", href: "attendance.html" },
        { key: "locker", label: "Locker", href: "locker.html" },
        { key: "trainee", label: "Trainee", href: "trainer.html" },
        {
            key: "schedule",
            label: "Schedule",
            href: "trainer-schedule.html",
            trainerHref: "trainer-schedule.html"
        },
        { key: "client_requests", label: "Client Requests", href: "client_requests.html" },
        { key: "reports", label: "Reports", href: "reports.html" },
        { key: "members", label: "Members", href: "member.html" },
        { key: "walkins", label: "Walk-ins", href: "walkin.html" },
        { key: "staff", label: "Staff", href: "staff_manage.html" },
        { key: "archive", label: "Archive", href: "archive.html" },
        {
            key: "user_account_maintenance",
            label: "User Account Maintenance",
            href: "user_accounts.html"
        },
        { key: "backup_restore", label: "Backup & Restore", href: "backup_restore.html" },
        { key: "audit_logs", label: "Audit Logs", href: "audit_logs.html" }
    ];


    /* =====================================================
    NORMALIZE MODULE KEY
    ===================================================== */

    function normalizeModuleKey(value) {

        const key = String(value || "")
            .trim()
            .toLowerCase()
            .replace(/[\s-]+/g, "_");

        const aliases = {
            home: "dashboard",
            client_request: "client_requests",
            walk_in: "walkins",
            walk_in_management: "walkins",
            user_accounts: "user_account_maintenance",
            user_account: "user_account_maintenance",
            backup: "backup_restore",
            backup_and_restore: "backup_restore",
            audit_log: "audit_logs"
        };

        return aliases[key] || key;
    }


    /* =====================================================
    DYNAMIC PROFILE
    ===================================================== */

    function loadAuditProfile() {

        const name =
            user?.full_name ||
            user?.fullname ||
            user?.name ||
            user?.username ||
            "User";

        document.getElementById("profileName").textContent = name;

        document.getElementById("profileInitial").textContent =
            name.trim().charAt(0).toUpperCase();

        document.getElementById("profileRole").textContent =
            String(user?.role || "User")
                .replace(/_/g, " ")
                .replace(/\b\w/g, char => char.toUpperCase());
    }


    /* =====================================================
    DASHBOARD LINK
    ===================================================== */

    function getDashboardPage() {

        const role = String(user?.role || "").toLowerCase();

        const item = MODULE_MENU.find(module =>
            module.key === "dashboard"
        );

        return item.href[role] || "index.html";
    }


    /* =====================================================
    RENDER SIDEBAR
    ===================================================== */

    function renderAuditMenu(allowedModules) {

        const menu = document.getElementById("menu");

        if (!menu) return;

        const currentPage = window.location.pathname
            .split("/")
            .pop()
            .toLowerCase();

        menu.innerHTML = "";

        MODULE_MENU.forEach(item => {

            if (!allowedModules.has(item.key)) return;

            let page = typeof item.href === "object"
                ? item.href[String(user.role || "").toLowerCase()] || "index.html"
                : item.href;

            if (item.trainerHref &&
                String(user.role || "").toLowerCase() === "trainer") {
                page = item.trainerHref;
            }

            const link = document.createElement("a");

            link.href = page;
            link.dataset.module = item.key;
            link.textContent = item.label;

            if (currentPage === page.toLowerCase()) {
                link.classList.add("active");
            }

            menu.appendChild(link);
        });
    }


    /* =====================================================
    MODULE ACCESS VALIDATION
    ===================================================== */

    async function checkAuditModuleAccess() {

        if (!user) {
            window.location.href = "index.html";
            return false;
        }

        const userId = user.user_id || user.id;

        if (!userId) {
            console.error("User ID not found.");
            return false;
        }

        try {

            const response = await fetch(
                `${API_URL}/api/user/module-access/${encodeURIComponent(userId)}`,
                {
                    method: "GET",
                    cache: "no-store",
                    headers: {
                        "Accept": "application/json"
                    }
                }
            );

            if (!response.ok) {
                throw new Error("Unable to load module permissions.");
            }

            const data = await response.json();

            const modules = Array.isArray(data)
                ? data
                : Array.isArray(data.modules)
                    ? data.modules
                    : [];

            const allowedModules = new Set(
                modules.map(module => {

                    const key = typeof module === "string"
                        ? module
                        : module.module_key ||
                        module.key ||
                        module.module_name ||
                        "";

                    return normalizeModuleKey(key);

                }).filter(Boolean)
            );

            renderAuditMenu(allowedModules);

            if (!allowedModules.has("audit_logs")) {

                document.querySelector(".layout").innerHTML = `
                    <main style="font-family:Arial;text-align:center;padding:60px 20px">
                        <h2>Access Denied</h2>
                        <p>Wala kang permission para buksan ang Audit Logs.</p>
                        <button onclick="location.href='${getDashboardPage()}'">
                            Back to Dashboard
                        </button>
                    </main>
                `;

                return false;
            }

            return true;

        } catch (error) {

            console.error("AUDIT MODULE ACCESS ERROR:", error);

            document.querySelector(".layout").innerHTML = `
                <main style="font-family:Arial;text-align:center;padding:60px 20px">
                    <h2>Unable to Verify Access</h2>
                    <p>Hindi ma-verify ang module permissions.</p>
                    <button onclick="location.reload()">Retry</button>
                </main>
            `;

            return false;
        }
    }


    let auditRecords = [];
    let filteredRecords = [];
    let currentPage = 1;

    const searchInput = document.getElementById("auditSearch");
    const actionFilter = document.getElementById("actionFilter");
    const dateFilter = document.getElementById("dateFilter");
    const tableBody = document.getElementById("auditTableBody");
    const pagination = document.getElementById("auditPagination");
    const resultsInfo = document.getElementById("auditResultsInfo");

    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        })[character]);
    }

    function capitalize(value) {
        const text = String(value ?? "").trim();

        return text
            ? text.charAt(0).toUpperCase() + text.slice(1).toLowerCase()
            : "Unknown";
    }

    function normalizeAction(action) {
        const value = String(action || "").toLowerCase();

        if (value.includes("login") || value.includes("logout")) {
            return "login";
        }

        if (value.includes("create") || value.includes("register")) {
            return "created";
        }

        if (value.includes("add")) {
            return "added";
        }

        if (value.includes("update") || value.includes("edit")) {
            return "updated";
        }

        if (value.includes("delete") || value.includes("remove")) {
            return "deleted";
        }

        if (value.includes("archive")) {
            return "archived";
        }

        if (value.includes("restore")) {
            return "restored";
        }

        if (value.includes("backup")) {
            return "backup";
        }

        if (value.includes("setting")) {
            return "settings";
        }

        if (value.includes("payment")) {
            return "payment";
        }

        return value;
    }

    function getActionLabel(action) {
        const value = String(action || "").toUpperCase();

        const labels = {
            CREATE_MEMBER: "Create",
            ADD_MEMBER: "Create",
            CREATE_WALKIN: "Create",
            ADD_WALKIN: "Create",
            CREATE_STAFF: "Create",
            ADD_STAFF: "Create",

            RESTORE_MEMBER: "Restore",
            RESTORE_WALKIN: "Restore",
            RESTORE_STAFF: "Restore",

            DELETE_MEMBER: "Delete",
            DELETE_WALKIN: "Delete",
            DELETE_STAFF: "Delete",
            DELETE_ARCHIVED_MEMBER: "Delete",
            DELETE_ARCHIVED_WALKIN: "Delete",
            DELETE_ARCHIVED_STAFF: "Delete",

            ARCHIVE_MEMBER: "Archive",
            ARCHIVE_WALKIN: "Archive",
            ARCHIVE_STAFF: "Archive",

            WALKIN_PAYMENT: "Payment",
            MEMBERSHIP_PAYMENT: "Payment",
            MEMBERSHIP_TYPE_PAYMENT: "Payment",
            WALKIN_ACCESS_PAYMENT: "Payment",
            TRAINER_FEE_PAYMENT: "Payment",
            PAYMENT: "Payment",
            LOCKER_OVERTIME_PAYMENT: "Payment"
        };

        if (labels[value]) {
            return labels[value];
        }

        return value
            .replace(/_/g, " ")
            .toLowerCase()
            .replace(/\b\w/g, letter => letter.toUpperCase());
    }



    function getActionDescription(action) {
        const value = String(action || "").toUpperCase();

        const descriptions = {
            CREATE_MEMBER: "created new ",
            ADD_MEMBER: "created new ",
            CREATE_WALKIN: "created new ",
            ADD_WALKIN: "created new ",
            CREATE_STAFF: "created new ",
            ADD_STAFF: "created new ",

            ARCHIVE_MEMBER: "archived ",
            RESTORE_MEMBER: "restored ",
            DELETE_MEMBER: "deleted ",
            DELETE_ARCHIVED_MEMBER: "deleted from archive",

            ARCHIVE_WALKIN: "archived ",
            RESTORE_WALKIN: "restored ",
            DELETE_WALKIN: "deleted ",
            DELETE_ARCHIVED_WALKIN: "deleted from archive",

            ARCHIVE_STAFF: "archived ",
            RESTORE_STAFF: "restored ",
            DELETE_STAFF: "deleted ",
            DELETE_ARCHIVED_STAFF: "deleted from archive",

            MEMBERSHIP_PAYMENT: "processed membership payment",
            MEMBERSHIP_TYPE_PAYMENT: "processed membership type payment",
            WALKIN_ACCESS_PAYMENT: "processed walk-in access payment",
            TRAINER_FEE_PAYMENT: "processed trainer fee payment",
            WALKIN_LOCKER_USAGE: "recorded walk-in locker usage",
            LOCKER_OVERTIME: "recorded locker overtime",
            ACCEPT_LOCKER_BOOKING: "accepted locker booking",
            ACCEPT_TRAINER_REQUEST: "accepted trainer request"
        };

        return descriptions[value] ||
            value.replace(/_/g, " ").toLowerCase();
    }
        
    
    
    function getDetails(record) {
        const raw = String(record.details ?? "").trim();
        const action = String(record.raw_action || "").toUpperCase();

        if (!raw) {
            return "—";
        }

        // PAYMENT LOGS
        if (action.includes("PAYMENT")) {
            const parts = raw.split("|").map(part => part.trim());

            const getValue = (label) => {
                const escapedLabel = label.replace(
                    /[.*+?^${}()|[\]\\]/g,
                    "\\$&"
                );

                const item = parts.find(part =>
                    new RegExp("^" + escapedLabel + "\\s*:", "i").test(part)
                );

                return item
                    ? item.replace(
                        new RegExp("^" + escapedLabel + "\\s*:\\s*", "i"),
                        ""
                    ).trim()
                    : "";
            };

            const isMeaningful = (value) => {
                const normalized = String(value ?? "").trim().toLowerCase();

                return normalized !== "" &&
                    normalized !== "none" &&
                    normalized !== "null" &&
                    normalized !== "n/a" &&
                    normalized !== "0" &&
                    normalized !== "0.00" &&
                    normalized !== "php 0" &&
                    normalized !== "php 0.00";
            };

            const id = getValue("ID");
            const name = getValue("Name");
            const locker = getValue("Locker");

            // LOCKER OVERTIME PAYMENT
            const isLockerOvertime =
                action === "LOCKER_OVERTIME_PAYMENT" ||
                /locker\s+overtime/i.test(raw);

            if (isLockerOvertime) {
                const amount =
                    getValue("Amount Paid") ||
                    getValue("Payment Amount") ||
                    getValue("Total Paid") ||
                    getValue("Total");

                const summary = ["Locker Overtime"];

                if (isMeaningful(id)) {
                    summary.push("ID: " + id);
                }

                if (isMeaningful(name)) {
                    summary.push("Name: " + name);
                }

                if (isMeaningful(locker)) {
                    summary.push("Locker: " + locker);
                }

                if (isMeaningful(amount)) {
                    summary.push("Amount Paid: " + amount);
                }

                // Payment ID intentionally hidden from display.
                return summary.join(" | ");
            }

            // TRAINER PAYMENT
            const isTrainerPayment =
                /trainer\s+payment/i.test(raw) ||
                /trainer\s+fee\s+payment/i.test(raw) ||
                action === "TRAINER_FEE_PAYMENT";

            if (isTrainerPayment) {
                const summary = ["Trainer Payment"];

                const trainerName =
                    getValue("Trainer Name") ||
                    getValue("Trainer");

                const trainerId = getValue("Trainer ID");

                const trainerPlan =
                    getValue("Trainer Plan") ||
                    getValue("Plan");

                const trainerFee =
                    getValue("Trainer Fee") ||
                    getValue("Amount") ||
                    getValue("Payment Amount");

                if (isMeaningful(id)) {
                    summary.push("ID: " + id);
                }

                if (isMeaningful(name)) {
                    summary.push("Name: " + name);
                }

                if (isMeaningful(trainerName)) {
                    summary.push(
                        "Trainer: " + trainerName +
                        (
                            isMeaningful(trainerId)
                                ? " (" + trainerId + ")"
                                : ""
                        )
                    );
                } else if (isMeaningful(trainerId)) {
                    summary.push("Trainer: " + trainerId);
                }

                if (isMeaningful(trainerPlan)) {
                    summary.push("Trainer Plan: " + trainerPlan);
                }

                if (isMeaningful(trainerFee)) {
                    summary.push("Trainer Fee: " + trainerFee);
                }

                // Payment ID intentionally hidden from display.
                return summary.join(" | ");
            }

            // OTHER PAYMENT DETAILS
            const membershipFee = getValue("Membership Fee");
            const access = getValue("Access") || getValue("Daily Access");
            const lockerFee = getValue("Locker Fee");

            const trainerName =
                getValue("Trainer Name") ||
                getValue("Trainer");

            const trainerId = getValue("Trainer ID");
            const trainerPlan = getValue("Trainer Plan");
            const trainerFee = getValue("Trainer Fee");
            const total = getValue("Total Paid") || getValue("Total");

            const isMemberPayment =
                action === "PAYMENT" &&
                (
                    /member payment/i.test(raw) ||
                    Boolean(membershipFee)
                );

            const summary = [];

            summary.push(
                isMemberPayment
                    ? "Member Payment"
                    : "Walk-in Payment"
            );

            if (isMeaningful(id)) {
                summary.push("ID: " + id);
            }

            if (isMeaningful(name)) {
                summary.push("Name: " + name);
            }

            if (isMemberPayment) {
                if (isMeaningful(membershipFee)) {
                    summary.push("Membership Fee: " + membershipFee);
                }

                if (isMeaningful(access)) {
                    summary.push("Access: " + access);
                }

                if (isMeaningful(trainerName) || isMeaningful(trainerId)) {
                    let trainerLabel = "Trainer: ";

                    if (isMeaningful(trainerName)) {
                        trainerLabel += trainerName;
                    }

                    if (isMeaningful(trainerId)) {
                        trainerLabel += isMeaningful(trainerName)
                            ? " (" + trainerId + ")"
                            : trainerId;
                    }

                    summary.push(trainerLabel);
                }

                if (isMeaningful(trainerPlan)) {
                    summary.push("Trainer Plan: " + trainerPlan);
                }

                if (isMeaningful(trainerFee)) {
                    summary.push("Trainer Fee: " + trainerFee);
                }
            } else {
                if (isMeaningful(access)) {
                    summary.push("Access: " + access);
                }

                if (isMeaningful(locker)) {
                    summary.push("Locker: " + locker);
                }

                if (isMeaningful(lockerFee)) {
                    summary.push("Locker Fee: " + lockerFee);
                }

                if (isMeaningful(trainerName) || isMeaningful(trainerId)) {
                    let trainerLabel = "Trainer: ";

                    if (isMeaningful(trainerName)) {
                        trainerLabel += trainerName;
                    }

                    if (isMeaningful(trainerId)) {
                        trainerLabel += isMeaningful(trainerName)
                            ? " (" + trainerId + ")"
                            : trainerId;
                    }

                    summary.push(trainerLabel);
                }

                if (isMeaningful(trainerFee)) {
                    summary.push("Trainer Fee: " + trainerFee);
                }
            }

            if (isMeaningful(total)) {
                summary.push("Total Paid: " + total);
            }

            return summary.join(" | ");
        }

        // NON-PAYMENT AUDIT LOGS
        const parts = raw.split("|").map(part => part.trim());
        const entity = parts[0] || "";

        const idPart = parts.find(part => /^ID\s*:/i.test(part));
        const namePart = parts.find(part => /^Name\s*:/i.test(part));

        const targetId = idPart
            ? idPart.replace(/^ID\s*:\s*/i, "").trim()
            : "";

        const targetName = namePart
            ? namePart.replace(/^Name\s*:\s*/i, "").trim()
            : "";

        const target = [
            entity,
            targetId,
            targetName ? `(${targetName})` : ""
        ].filter(Boolean).join(" ");

        const actorRole = String(record.actor_role || "").trim();

        const actorName = String(
            record.actor_name || record.actor_id || "Unknown"
        ).trim();

        const actionDescription = getActionDescription(record.raw_action);

        if (!actionDescription || !target) {
            return raw;
        }

        const actor = actorRole
            ? `${capitalize(actorRole)} ${actorName}`
            : actorName;

        if (
            action === "CREATE_MEMBER" ||
            action === "ADD_MEMBER"
        ) {
            return ` ${actor} created new Member ${targetName || "Unknown"}${
                targetId ? ` (${targetId})` : ""
            }.`;
        }

        return `${actor} ${actionDescription} ${target}.`;
    }


    function parseDate(value) {
        if (!value) return null;

        // Assumes timestamps without a timezone are stored in UTC.
        let normalized = String(value).trim().replace(" ", "T");

        if (!/[zZ]$|[+-]\d{2}:\d{2}$/.test(normalized)) {
            normalized += "Z";
        }

        const date = new Date(normalized);

        return Number.isNaN(date.getTime()) ? null : date;
    }

    function getDateKey(value) {
        const date = String(value ?? "").slice(0, 10);

        return /^\d{4}-\d{2}-\d{2}$/.test(date) ? date : "";
    }

    function formatDate(value) {
        const date = parseDate(value);

        if (!date) return "—";

        return new Intl.DateTimeFormat("en-US", {
            timeZone: "Asia/Manila",
            month: "short",
            day: "2-digit",
            year: "numeric"
        }).format(date);
    }

    function showMessage(message) {
        tableBody.innerHTML = `
            <tr class="audit-empty-row">
                <td colspan="5">${escapeHTML(message)}</td>
            </tr>
        `;

        resultsInfo.textContent = message;
        pagination.innerHTML = "";
    }

    async function loadAuditLogs() {
        showMessage("Loading audit logs...");

        try {
            const response = await fetch(AUDIT_API_URL, {
                method: "GET",
                headers: {
                    "Accept": "application/json"
                },
                cache: "no-store"
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(
                    result.message || `Request failed (${response.status})`
                );
            }

            if (!Array.isArray(result.data)) {
                throw new Error("Invalid audit logs response from API.");
            }

            
            auditRecords = result.data.map(record => ({
                id: record.id,
                actor_name: record.actor_name || "",
                actor_id: record.actor_id || "",
                actor_role: record.actor_role || "",
                user_name: record.actor_name || "Unknown",
                role: record.actor_role
                    ? capitalize(record.actor_role)
                    : "Unknown",
                raw_action: record.action || "",
                action: getActionLabel(record.action),
                details: record.details || "",
                date: record.created_at || ""
            }));


            auditRecords = auditRecords.map(record => ({
                ...record,
                details: getDetails(record)
            }));

            applyFilters();

        } catch (error) {
            console.error("Failed to load audit logs:", error);

            showMessage(
                "Unable to load audit logs. Check the API connection and try again."
            );
        }
    }

    function applyFilters() {
        const query = searchInput.value.trim().toLowerCase();
        const selectedAction = actionFilter.value;
        const selectedDate = dateFilter.value;

        filteredRecords = auditRecords.filter(record => {
            const searchable = [
                record.user_name,
                record.actor_id,
                record.role,
                record.action,
                record.raw_action,
                record.details,
                formatDate(record.date)
            ].join(" ").toLowerCase();

            const matchesSearch =
                !query || searchable.includes(query);

            const matchesAction =
                selectedAction === "all" ||
                normalizeAction(record.raw_action) === selectedAction;

            const matchesDate =
                !selectedDate ||
                getDateKey(record.date) === selectedDate;

            return matchesSearch && matchesAction && matchesDate;
        });

        currentPage = 1;
        renderTable();
    }

    function renderTable() {
        const total = filteredRecords.length;
        const totalPages = Math.ceil(total / PAGE_SIZE);

        if (totalPages > 0 && currentPage > totalPages) {
            currentPage = totalPages;
        }

        const start = (currentPage - 1) * PAGE_SIZE;

        const pageRecords = filteredRecords.slice(
            start,
            start + PAGE_SIZE
        );

        if (pageRecords.length > 0) {
            tableBody.innerHTML = pageRecords.map(record => `
                <tr>
                    <td>${escapeHTML(record.user_name)}</td>
                    <td>${escapeHTML(record.role)}</td>
                    <td>${escapeHTML(record.action)}</td>
                    <td>${escapeHTML(record.details)}</td>
                    <td>${escapeHTML(formatDate(record.date))}</td>
                </tr>
            `).join("");
        } else {
            tableBody.innerHTML = `
                <tr class="audit-empty-row">
                    <td colspan="5">No audit records found.</td>
                </tr>
            `;
        }

        resultsInfo.textContent = total === 0
            ? "Showing 0 logs"
            : `Showing ${start + 1} to ${Math.min(
                start + PAGE_SIZE,
                total
            )} of ${total} logs`;

        renderPagination(totalPages);
    }

    
    function renderPagination(totalPages) {
        pagination.innerHTML = "";

        if (totalPages <= 1) return;

        function addButton(label, page, active = false, disabled = false) {
            const button = document.createElement("button");

            button.type = "button";
            button.className =
                "audit-page-btn" + (active ? " active" : "");
            button.textContent = label;
            button.disabled = disabled;

            button.addEventListener("click", () => {
                currentPage = page;
                renderTable();
            });

            pagination.appendChild(button);
        }

        // Previous button
        addButton(
            "‹",
            Math.max(1, currentPage - 1),
            false,
            currentPage === 1
        );

        // Show only 3 consecutive page numbers
        const startPage = Math.min(
            Math.max(1, currentPage),
            Math.max(1, totalPages - 2)
        );

        const endPage = Math.min(totalPages, startPage + 2);

        for (let page = startPage; page <= endPage; page++) {
            addButton(
                String(page),
                page,
                page === currentPage
            );
        }

        // Next button
        addButton(
            "›",
            Math.min(totalPages, currentPage + 1),
            false,
            currentPage === totalPages
        );
    }



    searchInput.addEventListener("input", applyFilters);
    actionFilter.addEventListener("change", applyFilters);
    dateFilter.addEventListener("change", applyFilters);

    function toggleStaffMenu(event) {
        if (event) event.stopPropagation();

        document
            .getElementById("staffDropdown")
            .classList.toggle("show");
    }

    document.addEventListener("click", event => {
        const profile = document.getElementById("staffProfile");
        const dropdown = document.getElementById("staffDropdown");

        if (profile && !profile.contains(event.target)) {
            dropdown.classList.remove("show");
        }
    });

    function logout(event) {

        if (event) event.stopPropagation();

        localStorage.removeItem("user");

        window.location.href = "index.html";
    }

    /* =====================================================
    INITIALIZE AUDIT LOGS
    ===================================================== */

    async function initializeAuditPage() {

        loadAuditProfile();

        const hasAccess = await checkAuditModuleAccess();

        if (!hasAccess) return;

        dateFilter.value = "";

        await loadAuditLogs();
    }

    initializeAuditPage();
</script>

<!-- SOCKET -->
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<script>
const API_URL = "https://smartgym-api-ia2e.onrender.com";

// ================= MENU =================
const menu = document.getElementById("menu");

if(user.role === "admin"){
    menu.innerHTML = `
    <a href="admin.html">
        <i class="fa-solid fa-house"></i>
        Home
    </a>

   <a href="messages.html" class="msg-link">

        <i class="fa-regular fa-comment"></i>

        Messages

        <span
            id="msg-count"
            class="msg-count">
            0
        </span>

    </a>

    <a href="attendance.html">
        <i class="fa-regular fa-calendar-check"></i>
        Attendance
    </a>

    <a href="locker.html">
        <i class="fa-solid fa-lock"></i>
        Locker
    </a>

    <a href="members.html">
        <i class="fa-solid fa-users"></i>
        Members
    </a>

    <a href="staff_manage.html">
        <i class="fa-regular fa-user"></i>
        Staff
    </a>

    <a href="create_account.html">
        <i class="fa-solid fa-user-plus"></i>
        Create Account
    </a>
`;
}else{
    menu.innerHTML = `
        <a href="staff.html">
            <i class="fa-solid fa-house"></i>
            Home
        </a>

        <a href="messages.html" class="msg-link">

            <i class="fa-regular fa-comment"></i>

            Messages

            <span
                id="msg-count"
                class="msg-count">
                0
            </span>

        </a>

        <a href="attendance.html">
            <i class="fa-regular fa-calendar-check"></i>
            Attendance
        </a>

        <a href="locker.html">
            <i class="fa-solid fa-lock"></i>
            Locker
        </a>
    `;
}
let lastUnread = 0;

function showNotifPopup(title,text){

    const popup =
        document.getElementById(
            "notifPopup"
        );

    document.getElementById(
        "notifTitle"
    ).innerText = title;

    document.getElementById(
        "notifText"
    ).innerText = text;

    popup.classList.add("show");

    setTimeout(() => {

        popup.classList.remove(
            "show"
        );

    },4000);
}
// ================= SOCKET =================
const socket = io(API_URL, {
    transports: ["websocket"],
    reconnection: true
});

socket.on("connect", () => {
    console.log("CONNECTED 🔥");
});

socket.on("attendance_update", () => {
    console.log("REALTIME UPDATE 🔥");
    loadAttendance();
});
async function loadMessageCount(){

    const res = await fetch(
        `${API_URL}/api/admin_messages`
    );

    const data = await res.json();

    const unread =
        data.filter(
            m => m.is_read == 0
        ).length;
    
        if(
            lastUnread !== 0 &&
            unread > lastUnread
        ){

            document
                .getElementById(
                    "notifSound"
                )
                ?.play();

            showNotifPopup(
                "New Message",
                `${unread - lastUnread} new notification`
            );
        }

        lastUnread = unread;

    const badge =
        document.getElementById(
            "msg-count"
        );

    if(!badge) return;

    badge.innerText =
        unread > 99
        ? "99+"
        : unread;

    badge.style.display =
        unread > 0
        ? "flex"
        : "none";
}

// ================= LOAD ATTENDANCE =================
async function loadAttendance(){
    try{
        const date = document.getElementById("dateFilter").value;

        let url = `${API_URL}/api/attendance`;

        if(date){
            url += `?date=${date}`;
        }

        console.log("Loading attendance:", url);

        const res = await fetch(url);

        if(!res.ok){
            throw new Error(`HTTP Error: ${res.status}`);
        }

        const result = await res.json();

        console.log("Attendance API:", result);

        const data = result.data || [];

        const table = document.getElementById("attendance-body");

        table.innerHTML = "";

        if(data.length === 0){
            table.innerHTML = `
                <tr>
                    <td colspan="5">No records found</td>
                </tr>
            `;
            return;
        }

        data.forEach(row => {

            const tr = document.createElement("tr");

            tr.innerHTML = `
                <td>${row.name || "-"}</td>

                <td>
                    ${row.type
                        ? row.type.charAt(0).toUpperCase() + row.type.slice(1)
                        : "-"
                    }
                </td>

                <td>${row.time_in || "-"}</td>

                <td>${row.time_out || "-"}</td>

                <td class="${getColor(row.remarks)}">
                    ${row.remarks || "-"}
                </td>
            `;

            table.appendChild(tr);
        });

    }catch(err){

        console.error("Attendance error:", err);

        const table = document.getElementById("attendance-body");

        table.innerHTML = `
            <tr>
                <td colspan="5">
                    Unable to connect to attendance server.
                </td>
            </tr>
        `;
    }
}

// ================= HELPERS =================
function getColor(status){
    if(status === "Active") return "blue";
    if(status === "Completed") return "green";
    if(status === "Overtime") return "red";
    return "";
}

function formatAttendanceTime(dt){

    if(!dt || dt === "-"){
        return "-";
    }

    try{

        const d =
            new Date(dt);

        if(isNaN(d.getTime())){
            return dt;
        }

        return d.toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    }
    catch{
        return dt;
    }

}

function showNotifPopup(title,text){

    const popup =
        document.getElementById(
            "notifPopup"
        );

    if(!popup) return;

    document.getElementById(
        "notifTitle"
    ).innerText = title;

    document.getElementById(
        "notifText"
    ).innerText = text;

    popup.classList.add("show");

    setTimeout(() => {

        popup.classList.remove(
            "show"
        );

    },4000);
}

// ================= STAFF PROFILE DROPDOWN =================

function toggleStaffMenu(){

    const profile =
        document.querySelector(".staff-profile");

    const dropdown =
        document.getElementById("staffDropdown");

    if(!profile || !dropdown) return;

    profile.classList.toggle("active");

    dropdown.classList.toggle("show");
}


// ================= CLOSE DROPDOWN =================

window.addEventListener("click", function(e){

    if(!e.target.closest(".staff-profile")){

        const profile =
            document.querySelector(".staff-profile");

        const dropdown =
            document.getElementById("staffDropdown");

        if(profile){
            profile.classList.remove("active");
        }

        if(dropdown){
            dropdown.classList.remove("show");
        }

    }

});


// ================= LOGOUT =================

function logout(){

    localStorage.clear();

    window.location.href = "index.html";
}

// ================= INIT =================
window.onload = () => {
    const today = new Date().toISOString().split("T")[0];
    document.getElementById("dateFilter").value = today;
    loadAttendance();
};
loadMessageCount();
// 🔁 fallback refresh
setInterval(loadAttendance, 10000);
socket.on("new_message", () => {

    loadMessages();
    loadMessageCount();
});

socket.on("priority_alert", () => {

    loadMessages();
    loadMessageCount();
});
</script>

<!-- SOCKET -->
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<script>
const API_URL = "https://smartgym-api-ia2e.onrender.com";


/* =====================================================
   MASTER MODULE MENU
===================================================== */

const menu = document.getElementById("menu");

const MODULE_MENU = [
    { key: "dashboard", label: "Home", page: null },
    { key: "messages", label: "Messages", page: "messages.html", badge: true },

    { key: "program", label: "Program", page: "program.html" },
    { key: "get_program", label: "Get Program", page: "get_program.html" },
    { key: "book_locker", label: "Book Locker", page: "locker_booking.html" },
    { key: "membership", label: "Membership", page: "membership.html" },

    { key: "attendance", label: "Attendance", page: "attendance.html" },
    { key: "locker", label: "Locker", page: "locker.html" },
    { key: "trainee", label: "Trainee", page: "trainer.html" },
    { key: "schedule", label: "Schedule", page: "trainer_schedule.html" },
    { key: "client_requests", label: "Client Requests", page: "client_requests.html" },

    { key: "reports", label: "Reports", page: "reports.html" },
    { key: "members", label: "Members", page: "members.html" },
    { key: "walkins", label: "Walk-ins", page: "walkin.html" },
    { key: "staff", label: "Staff", page: "staff_manage.html" },
    { key: "archive", label: "Archive", page: "archive.html" },

    { key: "user_account_maintenance", label: "User Account Maintenance", page: "user_accounts.html" },
    { key: "create_account", label: "Create Account", page: "create_account.html" },
    { key: "backup_restore", label: "Backup and Restore", page: "backup_restore.html" },
    { key: "audit_logs", label: "Audit Logs", page: "audit_logs.html" }
];


/* =====================================================
   HELPERS
===================================================== */

function normalizeModuleKey(value) {

    const key = String(value || "")
        .trim()
        .toLowerCase()
        .replace(/[\s-]+/g, "_");

    const aliases = {
        home: "dashboard",
        client_request: "client_requests",
        walk_in: "walkins",
        walk_in_management: "walkins",
        user_accounts: "user_account_maintenance",
        user_account: "user_account_maintenance",
        backup: "backup_restore",
        backup_and_restore: "backup_restore",
        audit_log: "audit_logs"
    };

    return aliases[key] || key;
}


function getDashboardPage() {

    const role = String(user?.role || "").toLowerCase();

    const dashboards = {
        manager: "manager.html",
        admin: "admin.html",
        staff: "staff.html",
        front_desk: "staff.html",
        trainer: "trainer.html",
        member: "member_dashboard.html",
        walkin: "walkin_dashboard.html"
    };

    return dashboards[role] || "index.html";
}


/* =====================================================
   DYNAMIC PROFILE
===================================================== */

function loadAttendanceProfile() {

    const name =
        user?.full_name ||
        user?.fullname ||
        user?.name ||
        user?.username ||
        "User";

    document.getElementById("staffName").textContent = name;

    document.getElementById("staffAvatar").textContent =
        name.trim().charAt(0).toUpperCase();

    document.getElementById("staffRole").textContent =
        String(user?.role || "User")
            .replace(/_/g, " ")
            .replace(/\b\w/g, char => char.toUpperCase());
}


/* =====================================================
   RENDER SIDEBAR
===================================================== */

function renderAttendanceMenu(allowedModules) {

    const currentPage = window.location.pathname
        .split("/")
        .pop()
        .toLowerCase();

    menu.innerHTML = "";

    MODULE_MENU.forEach(item => {

        if (!allowedModules.has(item.key)) return;

        const link = document.createElement("a");

        link.href = item.key === "dashboard"
            ? getDashboardPage()
            : item.page;

        link.dataset.module = item.key;

        link.innerHTML = `
            ${item.label}
            ${item.badge
                ? '<span id="msg-count" class="msg-count">0</span>'
                : ""}
        `;

        if (
            item.key === "dashboard" &&
            currentPage === getDashboardPage().toLowerCase()
        ) {
            link.classList.add("active");
        }

        if (
            item.page &&
            currentPage === item.page.toLowerCase()
        ) {
            link.classList.add("active");
        }

        menu.appendChild(link);
    });
}


/* =====================================================
   CHECK ATTENDANCE MODULE ACCESS
===================================================== */

async function checkAttendancePageAccess() {

    const userId = user?.user_id || user?.id;

    if (!user || !userId) {
        window.location.href = "index.html";
        return false;
    }

    try {

        const response = await fetch(
            `${API_URL}/api/user/module-access/${encodeURIComponent(userId)}`,
            {
                method: "GET",
                cache: "no-store",
                headers: {
                    "Accept": "application/json"
                }
            }
        );

        if (!response.ok) {
            throw new Error("Unable to verify module access.");
        }

        const data = await response.json();

        const modules = Array.isArray(data)
            ? data
            : Array.isArray(data.modules)
                ? data.modules
                : [];

        const allowedModules = new Set(
            modules.map(module => {

                const key = typeof module === "string"
                    ? module
                    : module.module_key ||
                      module.key ||
                      module.module_name ||
                      "";

                return normalizeModuleKey(key);

            }).filter(Boolean)
        );

        renderAttendanceMenu(allowedModules);

        if (!allowedModules.has("attendance")) {

            const homepage = getDashboardPage();

            document.body.innerHTML = `
                <main style="font-family:Arial;text-align:center;padding:60px 20px">
                    <h2>Access Denied</h2>
                    <p>Wala kang permission para buksan ang Attendance.</p>
                    <button onclick="location.href='${homepage}'">
                        Back to Dashboard
                    </button>
                </main>
            `;

            return false;
        }

        return true;

    } catch (error) {

        console.error("ATTENDANCE ACCESS ERROR:", error);

        document.body.innerHTML = `
            <main style="font-family:Arial;text-align:center;padding:60px 20px">
                <h2>Unable to Verify Access</h2>
                <p>Hindi ma-verify ang module permission. Pakisubukan ulit.</p>
                <button onclick="location.reload()">Retry</button>
            </main>
        `;

        return false;
    }
}

let lastUnread = 0;

function showNotifPopup(title,text){

    const popup =
        document.getElementById(
            "notifPopup"
        );

    document.getElementById(
        "notifTitle"
    ).innerText = title;

    document.getElementById(
        "notifText"
    ).innerText = text;

    popup.classList.add("show");

    setTimeout(() => {

        popup.classList.remove(
            "show"
        );

    },4000);
}
// ================= SOCKET =================
const socket = io(API_URL, {
    transports: ["websocket"],
    reconnection: true
});

socket.on("connect", () => {
    console.log("CONNECTED 🔥");
});

socket.on("attendance_update", () => {
    console.log("REALTIME UPDATE 🔥");
    loadAttendance();
});
async function loadMessageCount(){

    const res = await fetch(
        `${API_URL}/api/admin_messages`
    );

    const data = await res.json();

    const unread =
        data.filter(
            m => m.is_read == 0
        ).length;
    
        if(
            lastUnread !== 0 &&
            unread > lastUnread
        ){

            document
                .getElementById(
                    "notifSound"
                )
                ?.play();

            showNotifPopup(
                "New Message",
                `${unread - lastUnread} new notification`
            );
        }

        lastUnread = unread;

    const badge =
        document.getElementById(
            "msg-count"
        );

    if(!badge) return;

    badge.innerText =
        unread > 99
        ? "99+"
        : unread;

    badge.style.display =
        unread > 0
        ? "flex"
        : "none";
}

// ================= LOAD ATTENDANCE =================
async function loadAttendance(){
    try{
        const date = document.getElementById("dateFilter").value;

        let url = `${API_URL}/api/attendance`;

        if(date){
            url += `?date=${date}`;
        }

        console.log("Loading attendance:", url);

        const res = await fetch(url);

        if(!res.ok){
            throw new Error(`HTTP Error: ${res.status}`);
        }

        const result = await res.json();

        console.log("Attendance API:", result);

        const data = result.data || [];

        const table = document.getElementById("attendance-body");

        table.innerHTML = "";

        if(data.length === 0){
            table.innerHTML = `
                <tr>
                    <td colspan="5">No records found</td>
                </tr>
            `;
            return;
        }

        data.forEach(row => {

            const tr = document.createElement("tr");

            tr.innerHTML = `
                <td>${row.name || "-"}</td>

                <td>
                    ${row.type
                        ? row.type.charAt(0).toUpperCase() + row.type.slice(1)
                        : "-"
                    }
                </td>

                <td>${row.time_in || "-"}</td>

                <td>${row.time_out || "-"}</td>

                <td class="${getColor(row.remarks)}">
                    ${row.remarks || "-"}
                </td>
            `;

            table.appendChild(tr);
        });

    }catch(err){

        console.error("Attendance error:", err);

        const table = document.getElementById("attendance-body");

        table.innerHTML = `
            <tr>
                <td colspan="5">
                    Unable to connect to attendance server.
                </td>
            </tr>
        `;
    }
}

// ================= HELPERS =================
function getColor(status){
    if(status === "Active") return "blue";
    if(status === "Completed") return "green";
    if(status === "Overtime") return "red";
    return "";
}

function formatAttendanceTime(dt){

    if(!dt || dt === "-"){
        return "-";
    }

    try{

        const d =
            new Date(dt);

        if(isNaN(d.getTime())){
            return dt;
        }

        return d.toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    }
    catch{
        return dt;
    }

}

function showNotifPopup(title,text){

    const popup =
        document.getElementById(
            "notifPopup"
        );

    if(!popup) return;

    document.getElementById(
        "notifTitle"
    ).innerText = title;

    document.getElementById(
        "notifText"
    ).innerText = text;

    popup.classList.add("show");

    setTimeout(() => {

        popup.classList.remove(
            "show"
        );

    },4000);
}

// ================= STAFF PROFILE DROPDOWN =================

function toggleStaffMenu(){

    const profile =
        document.querySelector(".staff-profile");

    const dropdown =
        document.getElementById("staffDropdown");

    if(!profile || !dropdown) return;

    profile.classList.toggle("active");

    dropdown.classList.toggle("show");
}


// ================= CLOSE DROPDOWN =================

window.addEventListener("click", function(e){

    if(!e.target.closest(".staff-profile")){

        const profile =
            document.querySelector(".staff-profile");

        const dropdown =
            document.getElementById("staffDropdown");

        if(profile){
            profile.classList.remove("active");
        }

        if(dropdown){
            dropdown.classList.remove("show");
        }

    }

});


// ================= LOGOUT =================

function logout() {
    localStorage.removeItem("user");
    window.location.href = "index.html";
}
// ================= INIT =================
let attendanceAccessGranted = false;

window.onload = async () => {

    loadAttendanceProfile();

    const hasAccess = await checkAttendancePageAccess();

    if (!hasAccess) return;

    attendanceAccessGranted = true;

    const today = new Date().toLocaleDateString("en-CA");

    document.getElementById("dateFilter").value = today;

    setAttendanceActiveLink();

    await loadAttendance();

    if (document.querySelector('#menu a[href="messages.html"]')) {
        loadMessageCount();
    }

    setInterval(() => {

        if (attendanceAccessGranted) {
            loadAttendance();
        }

    }, 10000);
};

socket.on("priority_alert", () => {

    loadMessages();
    loadMessageCount();
});
</script>

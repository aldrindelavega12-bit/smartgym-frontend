<script>

/* =========================================================
   API
========================================================= */

const API_URL =
    "https://smartgym-api-ia2e.onrender.com";


/* =========================================================
   TRAINER ID
========================================================= */

const trainerId =
    user?.user_id ||
    user?.id;


/* =========================================================
   TRAINER MESSAGES ENDPOINT
========================================================= */

const TRAINER_MESSAGES_ENDPOINT =
    `${API_URL}/api/trainer_messages`;


/* =========================================================
   MENU
========================================================= */

const menu =
    document.getElementById(
        "menu"
    );


menu.innerHTML = `

    <a href="trainer.html">

        <i class="fa-solid fa-house"></i>

        Home

    </a>


    <a
        href="trainer_messages.html"
        class="msg-link"
    >

        <i class="fa-solid fa-envelope"></i>

        Messages

        <span
            id="msg-count"
            class="msg-count"
        >
            0
        </span>

    </a>


    <a href="trainee.html">

        <i class="fa-solid fa-users"></i>

        Trainee

    </a>


    <a href="client_requests.html">

        <i class="fa-solid fa-user-clock"></i>

        Client Requests

    </a>

`;


/* =========================================================
   PROFILE
========================================================= */

const fullname =
    user?.fullname ||
    user?.name ||
    "Trainer";


document.getElementById(
    "trainerName"
).innerText =
    fullname;


document.getElementById(
    "trainerAvatar"
).innerText =
    fullname
        .charAt(0)
        .toUpperCase();


/* =========================================================
   SOCKET
========================================================= */

const socket =
    io(
        API_URL,
        {
            transports: [
                "websocket"
            ]
        }
    );


let currentMessages = [];

let lastUnread = 0;


/* =========================================================
   LOAD TRAINER MESSAGES
   ONE CARD PER MEMBER
========================================================= */

async function loadMessages(){

    try{

        let url =
            TRAINER_MESSAGES_ENDPOINT;


        if(trainerId){

            url +=
                `?trainer_id=${
                    encodeURIComponent(
                        trainerId
                    )
                }`;

        }


        const res =
            await fetch(
                url,
                {
                    cache:
                        "no-store"
                }
            );


        if(!res.ok){

            throw new Error(
                `HTTP ${res.status}`
            );

        }


        const data =
            await res.json();


        currentMessages =
            Array.isArray(data)
            ? data
            : [];


        const list =
            document.getElementById(
                "messages-list"
            );


        list.innerHTML = "";


        /* =================================================
           NO MESSAGE
        ================================================= */

        if(
            currentMessages.length === 0
        ){

            list.innerHTML = `

                <li
                    class="msg-card"
                    style="cursor:default;"
                >

                    No messages

                </li>

            `;

            return;

        }


        /* =================================================
           GROUP MESSAGES BY MEMBER
           ONE CARD PER MEMBER
        ================================================= */

        const grouped = {};


        currentMessages.forEach(
            msg => {

                const memberId =
                    msg.sender_id ||
                    msg.member_id ||
                    msg.member_name ||
                    "unknown";


                if(
                    !grouped[memberId]
                ){

                    grouped[memberId] = {

                        member_id:
                            memberId,

                        member_name:
                            msg.member_name ||
                            "Member",

                        messages: []

                    };

                }


                grouped[memberId]
                    .messages
                    .push(msg);

            }
        );


        /* =================================================
           SORT EACH MEMBER'S MESSAGES
           LATEST FIRST
        ================================================= */

        const members =
            Object.values(
                grouped
            );


        members.forEach(
            member => {

                member.messages.sort(
                    (a,b) =>
                        Number(
                            b.id || 0
                        )
                        -
                        Number(
                            a.id || 0
                        )
                );

            }
        );


        /* =================================================
           SORT MEMBERS
           LATEST ACTIVITY FIRST
        ================================================= */

        members.sort(
            (a,b) =>
                Number(
                    b.messages[0]?.id || 0
                )
                -
                Number(
                    a.messages[0]?.id || 0
                )
        );


        /* =================================================
           CREATE ONE CARD PER MEMBER
        ================================================= */

        members.forEach(
            member => {

                const latestMessage =
                    member.messages[0];


                /* =================================================
                   CHECK ALL MESSAGES FOR UNREAD
                ================================================= */

                const hasUnread =
                    member.messages.some(
                        msg =>
                            Number(
                                msg.is_read
                            ) === 0
                    );


                const card =
                    document.createElement(
                        "li"
                    );


                card.className =
                    "msg-card" +
                    (
                        hasUnread
                        ? " unread"
                        : ""
                    );


                /* =================================================
                   CARD CLICK
                ================================================= */

                card.onclick =
                    () =>
                        openMemberMessages(
                            member.member_id
                        );


                /* =================================================
                   CARD
                ================================================= */

                card.innerHTML = `

                    <div
                        class="msg-top"
                    >

                        <div
                            class="sender-info"
                        >

                            <h3>

                                ${
                                    member.member_name
                                }

                            </h3>


                            <span
                                class="sender-role"
                            >

                                ${
                                    member.member_id
                                }

                            </span>


                            ${
                                hasUnread
                                ?
                                `
                                <span
                                    class="unread-badge"
                                >

                                    NEW / UNREAD

                                </span>
                                `
                                :
                                ""
                            }

                        </div>


                        <div
                            class="dots"
                            onclick="
                                event.stopPropagation();
                                toggleMenu('${member.member_id}')
                            "
                        >

                            ⋮

                        </div>

/* =========================================================
   OPEN MEMBER MESSAGE
========================================================= */

async function openMemberMessages(
    memberId
){

    const memberMessages =
        currentMessages.filter(
            msg =>
                (
                    msg.sender_id ||
                    msg.member_id ||
                    msg.member_name
                ) === memberId
        );


    if(
        memberMessages.length === 0
    ){

        return;

    }


    /* =================================================
       SORT LATEST FIRST
    ================================================= */

    memberMessages.sort(
        (a,b) =>
            Number(
                b.id || 0
            )
            -
            Number(
                a.id || 0
            )
    );


    const latestMessage =
        memberMessages[0];


    /* =================================================
       SHOW LATEST MESSAGE
    ================================================= */

    document.getElementById(
        "modalTitle"
    ).innerText =
        latestMessage.title ||
        "Training Notification";


    document.getElementById(
        "modalMessage"
    ).innerText =
        latestMessage.message ||
        "";


    document.getElementById(
        "modalDate"
    ).innerText =
        latestMessage.created_at ||
        "";


    document.getElementById(
        "messageModal"
    ).style.display =
        "flex";


    /* =================================================
       MARK ALL UNREAD FROM THIS MEMBER AS READ
    ================================================= */

    try{

        await Promise.all(

            memberMessages
                .filter(
                    msg =>
                        Number(
                            msg.is_read
                        ) === 0
                )
                .map(
                    msg =>

                        fetch(
                            `${API_URL}/api/message_read/${msg.id}`,
                            {
                                method:
                                    "POST"
                            }
                        )

                )

        );


        await loadMessages();

        await loadMessageCount();


    }catch(err){

        console.error(
            "MARK MEMBER MESSAGES READ ERROR:",
            err
        );

    }

}


/* =========================================================
   MARK ALL MEMBER MESSAGES READ
========================================================= */

async function markMemberMessagesRead(memberId){

    const memberMessages =
        currentMessages.filter(
            msg =>
                (
                    msg.sender_id ||
                    msg.member_id ||
                    msg.member_name
                ) === memberId
        );


    try{

        /* =================================================
           UPDATE DATABASE
        ================================================= */

        await Promise.all(

            memberMessages.map(
                async msg => {

                    const res =
                        await fetch(
                            `${API_URL}/api/message_read/${msg.id}?t=${Date.now()}`,
                            {
                                method: "POST",
                                cache: "no-store"
                            }
                        );


                    if(!res.ok){

                        throw new Error(
                            `Message ${msg.id} failed: HTTP ${res.status}`
                        );

                    }

                }
            )

        );


        /* =================================================
           UPDATE LOCAL STATE IMMEDIATELY
        ================================================= */

        currentMessages =
            currentMessages.map(
                msg => {

                    const sameMember =
                        (
                            msg.sender_id ||
                            msg.member_id ||
                            msg.member_name
                        ) === memberId;


                    if(sameMember){

                        return {
                            ...msg,
                            is_read: 1
                        };

                    }


                    return msg;

                }
            );


        /* =================================================
           REFRESH UI IMMEDIATELY
        ================================================= */

        await loadMessages();

        await loadMessageCount();


    }catch(err){

        console.error(
            "MARK MEMBER MESSAGES READ ERROR:",
            err
        );

    }

}

        );

/* =========================================================
   MESSAGE COUNT
========================================================= */

async function loadMessageCount(){

    try{

        let url =
            TRAINER_MESSAGES_ENDPOINT;


        if(trainerId){

            url +=
                `?trainer_id=${
                    encodeURIComponent(
                        trainerId
                    )
                }`;

        }


        const res =
            await fetch(
                url,
                {
                    cache:
                        "no-store"
                }
            );


        if(!res.ok){

            throw new Error(
                `HTTP ${res.status}`
            );

        }


        const data =
            await res.json();


        const messages =
            Array.isArray(data)
            ? data
            : [];


        const unread =
            messages.filter(
                m =>
                    Number(
                        m.is_read
                    ) === 0
            ).length;


        if(
            lastUnread !== 0 &&
            unread > lastUnread
        ){

            document
                .getElementById(
                    "notifSound"
                )
                ?.play()
                .catch(
                    () => {}
                );


            showNotifPopup(
                "New Training Message",
                `${
                    unread -
                    lastUnread
                } new notification`
            );

        }


        lastUnread =
            unread;


        const badge =
            document.getElementById(
                "msg-count"
            );


        if(!badge){

            return;

        }


        if(unread > 0){

            badge.innerText =
                unread > 99
                ? "99+"
                : unread;


            badge.style.display =
                "flex";

        }else{

            badge.style.display =
                "none";

        }


    }catch(err){

        console.error(
            "LOAD TRAINER MESSAGE COUNT ERROR:",
            err
        );

    }

}

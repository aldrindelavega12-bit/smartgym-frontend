
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance | Smart Gym</title>

    <link rel="stylesheet" href="css/admin-dashboard.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f7faf8;
            color: #17211c;
        }

        .main {
            padding: 28px 34px;
        }

        .maintenance-heading {
            margin-bottom: 22px;
        }

        .maintenance-heading h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 800;
            color: #111;
        }

        .maintenance-heading p {
            margin: 6px 0 0;
            color: #718078;
            font-size: 14px;
        }

        .maintenance-tabs {
            display: flex;
            align-items: center;
            gap: 0;
            background: #fff;
            border: 1px solid #e1e8e4;
            border-radius: 12px;
            padding: 0 8px;
            margin-bottom: 15px;
            overflow-x: auto;
        }

        .tab-button {
            border: none;
            background: transparent;
            padding: 18px 22px;
            color: #58665f;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            border-bottom: 3px solid transparent;
        }

        .tab-button:hover {
            color: #008f4c;
        }

        .tab-button.active {
            color: #008f4c;
            border-bottom-color: #008f4c;
        }

        .maintenance-card {
            background: #fff;
            border: 1px solid #e2e9e5;
            border-radius: 13px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, .035);
            overflow: hidden;
        }

        .table-toolbar {
            display: grid;
            grid-template-columns: minmax(200px, 1fr) auto 220px;
            gap: 12px;
            padding: 16px 16px;
        }

        .search-input,
        .sort-select,
        .form-control {
            width: 100%;
            height: 43px;
            padding: 0 15px;
            border: 1px solid #dce5e0;
            border-radius: 9px;
            outline: none;
            background: #fff;
            color: #26332c;
            font-family: inherit;
            font-size: 13px;
        }

        .search-input:focus,
        .sort-select:focus,
        .form-control:focus {
            border-color: #008f4c;
        }

        .add-button {
            height: 43px;
            padding: 0 20px;
            border: none;
            border-radius: 9px;
            background: #008f4c;
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .add-button:hover {
            background: #007c41;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            padding: 0 12px;
        }

        .maintenance-table {
            width: 100%;
            min-width: 850px;
            border-collapse: collapse;
        }

        .maintenance-table th {
            padding: 13px 14px;
            background: #eaf6f0;
            color: #263d31;
            font-size: 12px;
            font-weight: 700;
            text-align: left;
            white-space: nowrap;
        }

        .maintenance-table td {
            padding: 15px 14px;
            border-bottom: 1px solid #e9efeb;
            font-size: 13px;
            color: #536158;
            vertical-align: middle;
        }

        .maintenance-table tbody tr:hover {
            background: #fbfdfc;
        }

        .record-name {
            font-weight: 700;
            color: #17211c;
        }

        .record-id {
            display: block;
            margin-top: 5px;
            font-size: 11px;
            color: #89968e;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
        }

        .status-active {
            background: #d9f5e6;
            color: #008044;
        }

        .status-inactive {
            background: #fce8e8;
            color: #c0392b;
        }

        .action-group {
            display: flex;
            align-items: center;
            gap: 7px;
            white-space: nowrap;
        }

        .action-button {
            padding: 7px 11px;
            border: 1px solid #dce5e0;
            border-radius: 8px;
            background: #fff;
            color: #27352d;
            font-family: inherit;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        .action-button:hover {
            background: #f0f8f3;
            border-color: #008f4c;
            color: #008f4c;
        }

        .action-button.delete:hover {
            background: #fff1f1;
            border-color: #d9534f;
            color: #d9534f;
        }

        .table-footer {
            padding: 17px 22px;
            color: #7b8981;
            font-size: 12px;
        }

        .empty-state {
            padding: 35px !important;
            text-align: center;
            color: #89968e !important;
        }

        /* MODAL */

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, .45);
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 500px;
            background: #fff;
            border-radius: 13px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, .15);
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 19px 22px;
            border-bottom: 1px solid #e8eee9;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: #f1f5f2;
            cursor: pointer;
            font-size: 15px;
        }

        .modal-body {
            padding: 22px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #37463d;
            font-size: 12px;
            font-weight: 700;
        }

        .form-control {
            height: 42px;
        }

        textarea.form-control {
            height: 90px;
            padding: 12px 14px;
            resize: vertical;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 9px;
            padding: 16px 22px;
            border-top: 1px solid #e8eee9;
        }

        .cancel-button,
        .save-button {
            padding: 10px 18px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .cancel-button {
            background: #fff;
            border: 1px solid #dce5e0;
            color: #536158;
        }

        .save-button {
            background: #008f4c;
            border: 1px solid #008f4c;
            color: #fff;
        }

        .save-button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 25px;
            z-index: 10000;
            padding: 14px 20px;
            border-radius: 9px;
            background: #008f4c;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            display: none;
        }

        .notification.show {
            display: block;
        }

        @media (max-width: 900px) {
            .main {
                padding: 22px 16px;
            }

            .table-toolbar {
                grid-template-columns: 1fr;
            }

            .add-button {
                width: 100%;
            }
        }

        @media (max-width: 600px) {
            .maintenance-heading h1 {
                font-size: 25px;
            }

            .tab-button {
                padding: 15px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->

    <div class="navbar">

        <div class="brand">
            <div class="brand-text">
                <strong>SMART GYM</strong>
                <span>STRONGER PEOPLE • A HEALTHIER TOMORROW</span>
            </div>
        </div>

        <div class="menu" id="menu"></div>

    </div>

    <!-- MAIN CONTENT -->

    <div class="layout">

        <div class="main">

            <!-- TOP HEADER -->

            <div class="top-header">

                <div class="top-right">

                    <div class="staff-profile" onclick="toggleStaffMenu()">

                        <div class="staff-avatar" id="staffAvatar">
                            A
                        </div>

                        <div class="staff-info">
                            <strong id="staffName">Admin</strong>
                            <small id="staffRole">Administrator</small>
                        </div>

                        <i class="fa-solid fa-chevron-down staff-profile-chevron"></i>

                        <div id="staffDropdown" class="staff-profile-dropdown">
                            <button
                                class="staff-dropdown-logout"
                                onclick="logout(); event.stopPropagation();">
                                <i class="fa-solid fa-right-from-bracket"></i>
                                Log Out
                            </button>
                        </div>

                    </div>

                </div>

            </div>

            <!-- PAGE TITLE -->

            <div class="maintenance-heading">

                <h1>Maintenance</h1>

                <p>
                    Manage gym configurations, available options, and pricing.
                </p>

            </div>

            <!-- TABS -->

            <div class="maintenance-tabs">

                <button class="tab-button active"
                    data-category="programs"
                    onclick="switchTab('programs', this)">
                    Programs
                </button>

                <button class="tab-button"
                    data-category="gym_access_types"
                    onclick="switchTab('gym_access_types', this)">
                    Gym Access Types
                </button>

                <button class="tab-button"
                    data-category="membership_types"
                    onclick="switchTab('membership_types', this)">
                    Membership Types
                </button>

                <button class="tab-button"
                    data-category="trainer_plans"
                    onclick="switchTab('trainer_plans', this)">
                    Trainer Plans
                </button>

                <button class="tab-button"
                    data-category="modules"
                    onclick="switchTab('modules', this)">
                    Modules
                </button>

            </div>

            <!-- TABLE CARD -->

            <div class="maintenance-card">

                <div class="table-toolbar">

                    <input
                        type="text"
                        id="searchInput"
                        class="search-input"
                        placeholder="Search records..."
                        oninput="renderTable()">

                    <button class="add-button" onclick="openAddModal()">
                        <i class="fa-solid fa-plus"></i>
                        Add New Record
                    </button>

                    <select
                        id="sortSelect"
                        class="sort-select"
                        onchange="renderTable()">

                        <option value="default">Sort by</option>
                        <option value="name">Name A-Z</option>
                        <option value="name_desc">Name Z-A</option>
                        <option value="active">Active First</option>
                        <option value="inactive">Inactive First</option>

                    </select>

                </div>

                <div class="table-wrapper">

                    <table class="maintenance-table">

                        <thead id="tableHead"></thead>

                        <tbody id="tableBody">
                            <tr>
                                <td class="empty-state">
                                    Loading records...
                                </td>
                            </tr>
                        </tbody>

                    </table>

                </div>

                <div class="table-footer" id="tableFooter">
                    Showing 0 entries
                </div>

            </div>

        </div>

    </div>

    <!-- ADD / EDIT MODAL -->

    <div class="modal-overlay" id="recordModal">

        <div class="modal-box">

            <div class="modal-header">

                <h2 id="modalTitle">Add New Record</h2>

                <button class="modal-close" onclick="closeModal()">
                    <i class="fa-solid fa-xmark"></i>
                </button>

            </div>

            <form id="recordForm" onsubmit="saveRecord(event)">

                <div class="modal-body" id="modalFields"></div>

                <div class="modal-footer">

                    <button
                        type="button"
                        class="cancel-button"
                        onclick="closeModal()">
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="save-button"
                        id="saveButton">
                        Save Record
                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- PROGRAM STRUCTURE MODAL -->
    <div class="modal-overlay" id="structureModal">
        <div class="modal-box" style="max-width: 850px;">

            <div class="modal-header">
                <h2 id="structureModalTitle">Manage Program Splits</h2>

                <button class="modal-close" onclick="closeStructureModal()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="modal-body" id="structureModalBody">
                Loading...
            </div>

        </div>
    </div>

    <!-- NOTIFICATION -->

    <div class="notification" id="notification"></div>

    <script>
        // =====================================================
        // CONFIGURATION
        // =====================================================

        const API_URL = "https://smartgym-api-ia2e.onrender.com";

        const user = JSON.parse(localStorage.getItem("user") || "null");

        const API_ENDPOINTS = {
            programs: "/api/maintenance/programs",
            gym_access_types: "/api/maintenance/gym-access-types",
            membership_types: "/api/maintenance/membership-types",
            trainer_plans: "/api/maintenance/trainer-plans",
            modules: "/api/maintenance/modules"
        };

        const CONFIG = {
            programs: {
                title: "Programs",
                nameField: "program_name",
                columns: [
                    ["ID", "id"],
                    ["Program Name", "program_name"],
                    ["Description", "description"],
                    ["Duration", "duration_days"],
                    ["Status", "active"]
                ],
                fields: [
                    {
                        name: "program_name",
                        label: "Program Name",
                        type: "text",
                        required: true
                    },
                    {
                        name: "description",
                        label: "Description",
                        type: "textarea"
                    },
                    {
                        name: "duration_days",
                        label: "Duration (Days)",
                        type: "number",
                        required: true,
                        min: 1
                    }
                ],
                statusField: "active"
            },

            gym_access_types: {
                title: "Gym Access Types",
                nameField: "access_name",
                columns: [
                    ["ID", "id"],
                    ["Access Name", "access_name"],
                    ["Price", "price"],
                    ["Duration", "duration_days"],
                    ["Status", "status"]
                ],
                fields: [
                    {
                        name: "access_name",
                        label: "Access Name",
                        type: "text",
                        required: true
                    },
                    {
                        name: "price",
                        label: "Price",
                        type: "number",
                        required: true,
                        min: 0,
                        step: "0.01"
                    },
                    {
                        name: "duration_days",
                        label: "Duration (Days)",
                        type: "number",
                        required: true,
                        min: 1
                    }
                ],
                statusField: "status"
            },

            membership_types: {
                title: "Membership Types",
                nameField: "membership_name",
                columns: [
                    ["ID", "id"],
                    ["Membership Name", "membership_name"],
                    ["Fee", "fee"],
                    ["Validity", "validity_days"],
                    ["Status", "status"]
                ],
                fields: [
                    {
                        name: "membership_name",
                        label: "Membership Name",
                        type: "text",
                        required: true
                    },
                    {
                        name: "fee",
                        label: "Membership Fee",
                        type: "number",
                        required: true,
                        min: 0,
                        step: "0.01"
                    },
                    {
                        name: "validity_days",
                        label: "Validity (Days)",
                        type: "number",
                        required: true,
                        min: 1
                    }
                ],
                statusField: "status"
            },

            trainer_plans: {
                title: "Trainer Plans",
                nameField: "plan_name",
                columns: [
                    ["ID", "id"],
                    ["Trainer ID", "trainer_id"],
                    ["Plan Name", "plan_name"],
                    ["Duration", "duration_days"],
                    ["Price", "price"],
                    ["Status", "active"]
                ],
                fields: [
                    {
                        name: "trainer_id",
                        label: "Trainer ID",
                        type: "text",
                        required: true
                    },
                    {
                        name: "plan_name",
                        label: "Plan Name",
                        type: "text",
                        required: true
                    },
                    {
                        name: "duration_days",
                        label: "Duration (Days)",
                        type: "number",
                        required: true,
                        min: 1
                    },
                    {
                        name: "price",
                        label: "Price",
                        type: "number",
                        required: true,
                        min: 0,
                        step: "0.01"
                    }
                ],
                statusField: "active"
            },

            modules: {
                title: "Modules",
                nameField: "module_name",
                columns: [
                    ["ID", "id"],
                    ["Module Name", "module_name"],
                    ["Module Key", "module_key"],
                    ["Page URL", "page_url"],
                    ["Status", "active"]
                ],
                fields: [
                    {
                        name: "module_name",
                        label: "Module Name",
                        type: "text",
                        required: true
                    },
                    {
                        name: "module_key",
                        label: "Module Key",
                        type: "text",
                        required: true
                    },
                    {
                        name: "page_url",
                        label: "Page URL",
                        type: "text"
                    }
                ],
                statusField: "active"
            }
        };

        let currentCategory = "programs";
        let records = {};
        let editingId = null;

        Object.keys(CONFIG).forEach(category => {
            records[category] = [];
        });

        // =====================================================
        // AUTHENTICATION
        // =====================================================

        if (!user || user.role !== "admin") {
            window.location.href = "index.html";
        }

        if (user) {
            const displayName = user.full_name || user.name || "Admin";

            document.getElementById("staffName").textContent = displayName;
            document.getElementById("staffRole").textContent = user.role || "admin";
            document.getElementById("staffAvatar").textContent =
                displayName.charAt(0).toUpperCase();
        }

        // =====================================================
        // API HELPERS
        // =====================================================
        
        async function apiRequest(url, options = {}) {

            const method = (options.method || "GET").toUpperCase();

            const isMaintenanceRequest = url.includes("/api/maintenance/");

            const requestOptions = { ...options };

            if (isMaintenanceRequest) {

                if (!user || !user.user_id) {
                    throw new Error("Admin user ID not found. Please login again.");
                }

                const actorId = user.user_id;

                if (method === "GET") {

                    const separator = url.includes("?") ? "&" : "?";

                    url += `${separator}actor_id=${encodeURIComponent(actorId)}`;

                } else {

                    let payload = {};

                    if (requestOptions.body) {
                        payload = JSON.parse(requestOptions.body);
                    }

                    payload.actor_id = actorId;

                    requestOptions.body = JSON.stringify(payload);
                }
            }

            const response = await fetch(`${API_URL}${url}`, {
                ...requestOptions,
                headers: {
                    "Accept": "application/json",
                    "Content-Type": "application/json",
                    ...(requestOptions.headers || {})
                }
            });

            const result = await response.json().catch(() => ({}));

            if (!response.ok) {
                throw new Error(
                    result.message || result.error || `HTTP ${response.status}`
                );
            }

            return result;
        }

       
        function extractRecords(result) {
            if (Array.isArray(result)) {
                return result;
            }

            if (Array.isArray(result.data)) {
                return result.data;
            }

            if (Array.isArray(result.records)) {
                return result.records;
            }

            return [];
        }

        // =====================================================
        // LOAD RECORDS
        // =====================================================

        async function loadRecords(category = currentCategory) {
            const tbody = document.getElementById("tableBody");

            tbody.innerHTML = `
                <tr>
                    <td colspan="10" class="empty-state">
                        Loading records...
                    </td>
                </tr>
            `;

            try {
                const result = await apiRequest(
                    API_ENDPOINTS[category]
                );

                records[category] = extractRecords(result);

                renderTable();

            } catch (error) {
                console.error(`Failed to load ${category}:`, error);

                tbody.innerHTML = `
                    <tr>
                        <td colspan="10" class="empty-state">
                            Unable to load records.
                            Please check the backend API endpoint.
                        </td>
                    </tr>
                `;

                document.getElementById("tableFooter").textContent =
                    "Unable to load records.";
            }
        }

        // =====================================================
        // SWITCH TABS
        // =====================================================

        function switchTab(category, button) {
            currentCategory = category;

            document.querySelectorAll(".tab-button").forEach(tab => {
                tab.classList.remove("active");
            });

            button.classList.add("active");

            document.getElementById("searchInput").value = "";
            document.getElementById("sortSelect").value = "default";

            updateAddButton();
            renderTable();

            loadRecords(category);
        }

        function updateAddButton() {
            const button = document.querySelector(".add-button");

            button.innerHTML = `
                <i class="fa-solid fa-plus"></i>
                Add New ${CONFIG[currentCategory].title.replace(/s$/, "")}
            `;
        }

        // =====================================================
        // RENDER TABLE
        // =====================================================

        function renderTable() {
            const config = CONFIG[currentCategory];
            const tbody = document.getElementById("tableBody");
            const thead = document.getElementById("tableHead");

            thead.innerHTML = `
                <tr>
                    ${config.columns.map(column => `
                        <th>${escapeHTML(column[0])}</th>
                    `).join("")}
                    <th>Actions</th>
                </tr>
            `;

            const searchValue = document
                .getElementById("searchInput")
                .value.toLowerCase()
                .trim();

            const sortValue = document.getElementById("sortSelect").value;

            let filtered = [...(records[currentCategory] || [])];

            filtered = filtered.filter(record => {
                return Object.values(record).some(value =>
                    String(value ?? "").toLowerCase().includes(searchValue)
                );
            });

            if (sortValue === "name") {
                filtered.sort((a, b) =>
                    String(a[config.nameField] || "")
                        .localeCompare(String(b[config.nameField] || ""))
                );
            }

            if (sortValue === "name_desc") {
                filtered.sort((a, b) =>
                    String(b[config.nameField] || "")
                        .localeCompare(String(a[config.nameField] || ""))
                );
            }

            if (sortValue === "active") {
                filtered.sort((a, b) =>
                    Number(isActive(b, config.statusField)) -
                    Number(isActive(a, config.statusField))
                );
            }

            if (sortValue === "inactive") {
                filtered.sort((a, b) =>
                    Number(isActive(a, config.statusField)) -
                    Number(isActive(b, config.statusField))
                );
            }

            if (!filtered.length) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="${config.columns.length + 1}"
                            class="empty-state">
                            No records found.
                        </td>
                    </tr>
                `;
            } else {
                tbody.innerHTML = filtered.map(record => {
                    const cells = config.columns.map(column => {
                        const value = record[column[1]];

                        if (column[1] === config.statusField) {
                            return `
                                <td>
                                    ${renderStatus(value)}
                                </td>
                            `;
                        }

                        if (
                            column[1] === "price" ||
                            column[1] === "fee"
                        ) {
                            return `
                                <td>${formatCurrency(value)}</td>
                            `;
                        }

                        if (column[1] === "duration_days") {
                            return `
                                <td>${escapeHTML(value)} days</td>
                            `;
                        }

                        return `
                            <td>${escapeHTML(value ?? "--")}</td>
                        `;
                    }).join("");

                    return `
                        <tr>
                            ${cells}

                            <td>
                                <div class="action-group">

                                    ${currentCategory === "programs" ? `
                                            <button
                                                class="action-button"
                                                onclick="openProgramStructure(${Number(record.id)})">
                                                Manage Splits
                                            </button>
                                        ` : ""}

                                    <button
                                        class="action-button"
                                        onclick="editRecord(${Number(record.id)})">
                                        Edit
                                    </button>

                                    
                                    <button
                                        class="action-button"
                                        onclick="toggleStatus(${Number(record.id)})">
                                        ${isActive(record, config.statusField)
                                            ? "Deactivate"
                                            : "Activate"}
                                    </button>

                                    <button
                                        class="action-button delete"
                                        onclick="deleteRecord(${Number(record.id)})">
                                        Delete
                                    </button>

                                </div>
                            </td>
                        </tr>
                    `;
                }).join("");
            }

            document.getElementById("tableFooter").textContent =
                `Showing ${filtered.length} of ${records[currentCategory].length} entries`;
        }

        // =====================================================
        // STATUS HELPERS
        // =====================================================

        function isActive(record, field) {
            const value = record[field];

            if (value === undefined || value === null) {
                return false;
            }

            if (typeof value === "number") {
                return value === 1;
            }

            return ["1", "active", "true", "enabled"]
                .includes(String(value).toLowerCase());
        }

        function renderStatus(value) {
            const active = (
                value === 1 ||
                value === true ||
                String(value).toLowerCase() === "active"
            );

            return `
                <span class="status-badge ${
                    active ? "status-active" : "status-inactive"
                }">
                    ${active ? "Active" : "Inactive"}
                </span>
            `;
        }

        function formatCurrency(value) {
            const amount = Number(value);

            if (!Number.isFinite(amount)) {
                return "--";
            }

            return "₱" + amount.toLocaleString("en-PH", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        // =====================================================
        // MODAL
        // =====================================================

        function openAddModal() {
            editingId = null;

            document.getElementById("modalTitle").textContent =
                `Add New ${CONFIG[currentCategory].title.replace(/s$/, "")}`;

            document.getElementById("saveButton").textContent =
                "Save Record";

            buildForm({});
            document.getElementById("recordModal").classList.add("show");
        }

        function editRecord(id) {
            const record = records[currentCategory].find(item =>
                Number(item.id) === Number(id)
            );

            if (!record) {
                showNotification("Record not found.");
                return;
            }

            editingId = id;

            document.getElementById("modalTitle").textContent =
                `Edit ${CONFIG[currentCategory].title.replace(/s$/, "")}`;

            document.getElementById("saveButton").textContent =
                "Update Record";

            buildForm(record);
            document.getElementById("recordModal").classList.add("show");
        }

        function buildForm(record) {
            const config = CONFIG[currentCategory];
            const container = document.getElementById("modalFields");

            container.innerHTML = config.fields.map(field => {
                const value = record[field.name] ?? "";

                if (field.type === "textarea") {
                    return `
                        <div class="form-group">
                            <label for="${field.name}">
                                ${escapeHTML(field.label)}
                            </label>

                            <textarea
                                class="form-control"
                                id="${field.name}"
                                name="${field.name}"
                                ${field.required ? "required" : ""}
                            >${escapeHTML(value)}</textarea>
                        </div>
                    `;
                }

                return `
                    <div class="form-group">
                        <label for="${field.name}">
                            ${escapeHTML(field.label)}
                        </label>

                        <input
                            class="form-control"
                            type="${field.type}"
                            id="${field.name}"
                            name="${field.name}"
                            value="${escapeHTML(value)}"
                            ${field.required ? "required" : ""}
                            ${field.min !== undefined ? `min="${field.min}"` : ""}
                            ${field.step ? `step="${field.step}"` : ""}
                        >
                    </div>
                `;
            }).join("");
        }

        function closeModal() {
            document.getElementById("recordModal").classList.remove("show");
            document.getElementById("recordForm").reset();
            editingId = null;
        }

        // =====================================================
        // SAVE RECORD
        // =====================================================

        async function saveRecord(event) {
            event.preventDefault();

            const form = document.getElementById("recordForm");
            const saveButton = document.getElementById("saveButton");
            const formData = new FormData(form);

            const payload = {};

            for (const [key, value] of formData.entries()) {
                const field = CONFIG[currentCategory].fields.find(item =>
                    item.name === key
                );

                payload[key] = field && field.type === "number"
                    ? Number(value)
                    : value.trim();
            }

            saveButton.disabled = true;
            saveButton.textContent = "Saving...";

            try {
                const baseUrl = API_ENDPOINTS[currentCategory];

                const url = editingId
                    ? `${baseUrl}/${encodeURIComponent(editingId)}`
                    : baseUrl;

                await apiRequest(url, {
                    method: editingId ? "PUT" : "POST",
                    body: JSON.stringify(payload)
                });

                closeModal();

                showNotification(
                    editingId
                        ? "Record updated successfully."
                        : "Record added successfully."
                );

                await loadRecords(currentCategory);

            } catch (error) {
                console.error("Save error:", error);
                alert(error.message || "Unable to save record.");
            } finally {
                saveButton.disabled = false;
                saveButton.textContent = editingId
                    ? "Update Record"
                    : "Save Record";
            }
        }

        // =====================================================
        // ACTIVATE / DEACTIVATE
        // =====================================================

        async function toggleStatus(id) {
            const config = CONFIG[currentCategory];

            const record = records[currentCategory].find(item =>
                Number(item.id) === Number(id)
            );

            if (!record) return;

            const currentlyActive = isActive(
                record,
                config.statusField
            );

            const action = currentlyActive
                ? "deactivate"
                : "activate";

            if (!confirm(`Are you sure you want to ${action} this record?`)) {
                return;
            }

            const statusValue =
                config.statusField === "active"
                    ? (currentlyActive ? 0 : 1)
                    : (currentlyActive ? "inactive" : "active");

            try {
                await apiRequest(
                    `${API_ENDPOINTS[currentCategory]}/${encodeURIComponent(id)}/status`,
                    {
                        method: "PATCH",
                        body: JSON.stringify({
                            [config.statusField]: statusValue
                        })
                    }
                );

                showNotification(
                    `Record ${action}d successfully.`
                );

                await loadRecords(currentCategory);

            } catch (error) {
                console.error("Status update error:", error);
                alert(error.message || "Unable to update record status.");
            }
        }

        // =====================================================
        // DELETE RECORD
        // =====================================================

        async function deleteRecord(id) {
            const confirmed = confirm(
                "Are you sure you want to delete this record? This action cannot be undone."
            );

            if (!confirmed) return;

            try {
                await apiRequest(
                    `${API_ENDPOINTS[currentCategory]}/${encodeURIComponent(id)}`,
                    {
                        method: "DELETE"
                    }
                );

                showNotification("Record deleted successfully.");

                await loadRecords(currentCategory);

            } catch (error) {
                console.error("Delete error:", error);
                alert(error.message || "Unable to delete record.");
            }
        }

        // =====================================================
        // NOTIFICATION
        // =====================================================

        function showNotification(message) {
            const notification =
                document.getElementById("notification");

            notification.textContent = message;
            notification.classList.add("show");

            setTimeout(() => {
                notification.classList.remove("show");
            }, 3000);
        }

        // =====================================================
        // HTML ESCAPING
        // =====================================================

        function escapeHTML(value) {
            return String(value ?? "").replace(/[&<>"']/g, character => {
                const entities = {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                };

                return entities[character];
            });
        }

        // =====================================================
        // SIDEBAR MODULE ACCESS
        // =====================================================

        const ADMIN_MENU_ITEMS = [
            {
                key: "dashboard",
                label: "Home",
                page: "admin.html"
            },
            {
                key: "user_account_maintenance",
                label: "User Account Maintenance",
                page: "user_accounts.html"
            },
            {
                key: "backup_restore",
                label: "Backup & Restore",
                page: "backup_restore.html"
            },
            {
                key: "audit_logs",
                label: "Audit Logs",
                page: "audit_logs.html"
            },
            {
                key: "maintenance",
                label: "Maintenance",
                page: "maintenance.html"
            }
        ];

        async function loadAdminMenu() {
            const menu = document.getElementById("menu");

            if (!user || !user.user_id) {
                menu.innerHTML = "";
                return;
            }

            try {
                const result = await apiRequest(
                    `/api/user/module-access/${encodeURIComponent(user.user_id)}`
                );

                if (!Array.isArray(result.modules)) {
                    throw new Error("Invalid module permissions.");
                }

                const allowedModules = new Set(
                    result.modules.map(module => {
                        if (typeof module === "string") {
                            return module.toLowerCase();
                        }

                        return String(
                            module.module_key ||
                            module.module_name ||
                            module.key ||
                            ""
                        ).toLowerCase();
                    })
                );

                const currentPage = window.location.pathname
                    .split("/")
                    .pop()
                    .toLowerCase();

                menu.innerHTML = "";

                ADMIN_MENU_ITEMS
                    .filter(item => allowedModules.has(item.key))
                    .forEach(item => {
                        const link = document.createElement("a");

                        link.href = item.page;
                        link.textContent = item.label;

                        if (item.page.toLowerCase() === currentPage) {
                            link.classList.add("active");
                        }

                        menu.appendChild(link);
                    });

            } catch (error) {
                console.error("Sidebar error:", error);
                menu.innerHTML = "";
            }
        }

        // =====================================================
        // PROFILE DROPDOWN
        // =====================================================

        function toggleStaffMenu() {
            const profile = document.querySelector(".staff-profile");
            const dropdown = document.getElementById("staffDropdown");

            if (!dropdown || !profile) return;

            profile.classList.toggle("active");
            dropdown.classList.toggle("show");
        }

        window.addEventListener("click", event => {
            if (!event.target.closest(".staff-profile")) {
                document.querySelector(".staff-profile")
                    ?.classList.remove("active");

                document.getElementById("staffDropdown")
                    ?.classList.remove("show");
            }
        });

        // =====================================================
        // LOGOUT
        // =====================================================

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }

        // =====================================================
        // INITIALIZE
        // =====================================================

        updateAddButton();
        loadAdminMenu();
        loadRecords("programs");

    </script>

</body>
</html>

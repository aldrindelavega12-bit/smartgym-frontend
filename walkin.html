        </p>

<!-- =====================================================

===================================================== -->

<div class="layout">

                    <div class="staff-info">

                    </div>

                    </div>

                </div>

            </div>

        <!-- =================================================

        ================================================== -->

        <div class="page-header">

                Walk-ins

        <!-- =================================================
             WALK-IN PANEL

            <div class="walkin-table-wrapper">

</div>



<!-- =====================================================
     NOTIFICATION POPUP
===================================================== -->

<div
    id="notifPopup"

    <b id="notifTitle">
        New Message
    </b>

    </p>

        src="notif.mp3"

</audio>



<!-- SOCKET.IO -->

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>



<!-- =====================================================
     BASIC PAGE SCRIPT
     FUNCTIONALITY NEXT
===================================================== -->

<script>

const API_URL =
    "https://smartgym-api-ia2e.onrender.com";


const user =
    JSON.parse(
        localStorage.getItem("user")
    );


if(
    !user ||
    user.role !== "admin"
){

    window.location.href =
        "index.html";

}


/* =====================================================
   MENU
===================================================== */

const menu =
    document.getElementById("menu");


menu.innerHTML = `

    <a href="admin.html">

        <i class="fa-solid fa-house"></i>

        Home

    </a>


    <a href="messages.html"
       class="msg-link">

        <i class="fa-regular fa-envelope"></i>

        Messages

        <span
            id="msg-count"
            class="msg-count">

            0

        </span>

    </a>


    <a href="reports.html">

        <i class="fa-solid fa-chart-column"></i>

        Reports

    </a>


    <a href="members.html">

        <i class="fa-solid fa-users"></i>

        Members

    </a>


    <a href="walkin.html"
       class="active">

        <i class="fa-solid fa-person-walking"></i>

        Walk-ins

    </a>


    <a href="staff_manage.html">

        <i class="fa-regular fa-user"></i>

        Staff

    </a>

`;



/* =====================================================
   PROFILE DROPDOWN
===================================================== */

function toggleStaffMenu(){

    const profile =
        document.querySelector(
            ".staff-profile"
        );

    const dropdown =
        document.getElementById(
            "staffDropdown"
        );


    if(!dropdown)
        return;


    profile.classList.toggle(
        "active"
    );

    dropdown.classList.toggle(
        "show"
    );

}


window.addEventListener(
    "click",
    function(e){

        if(
            !e.target.closest(
                ".staff-profile"
            )
        ){

            const profile =
                document.querySelector(
                    ".staff-profile"
                );

            const dropdown =
                document.getElementById(
                    "staffDropdown"
                );


            if(profile)
                profile.classList.remove(
                    "active"
                );


            if(dropdown)
                dropdown.classList.remove(
                    "show"
                );

        }

    }
);



/* =====================================================
   LOGOUT
===================================================== */

function logout(){

    localStorage.clear();

    window.location.href =
        "index.html";

}

/* =========================================================
   WALK-IN DATA
========================================================= */

let allWalkins = [];

let filteredWalkins = [];

let currentWalkinPage = 1;

const walkinsPerPage = 8;


/* =========================================================
   LOAD WALK-INS
========================================================= */

async function loadWalkins(){

    try{

        const res =
            await fetch(
                `${API_URL}/api/website_walkins`,
                {
                    cache: "no-store"
                }
            );


        if(!res.ok){

            throw new Error(
                `HTTP ${res.status}`
            );

        }


        const result =
            await res.json();


        if(!result.success){

            throw new Error(
                result.error ||
                "Failed to load walk-ins."
            );

        }


        allWalkins =
            Array.isArray(result.data)
            ? result.data
            : [];


        applyWalkinFilters();


    }
    catch(error){

        console.error(
            "WALK-IN LOAD ERROR:",
            error
        );


        allWalkins = [];

        filteredWalkins = [];

        renderWalkins();

    }

}


/* =========================================================
   SEARCH + SORT
========================================================= */

function applyWalkinFilters(){

    const searchInput =
        document.getElementById(
            "walkinSearch"
        );

    const sortFilter =
        document.getElementById(
            "walkinSort"
        );


    const search =
        searchInput
        ? searchInput.value
            .trim()
            .toLowerCase()
        : "";


    /* =========================
       SEARCH
    ========================= */

    filteredWalkins =
        allWalkins.filter(walkin => {

            const id =
                String(
                    walkin.id || ""
                ).toLowerCase();


            const name =
                String(
                    walkin.name || ""
                ).toLowerCase();


            const phone =
                String(
                    walkin.phone || ""
                ).toLowerCase();


            return (
                !search ||
                id.includes(search) ||
                name.includes(search) ||
                phone.includes(search)
            );

        });


    /* =========================
       SORT
    ========================= */

    const sort =
        sortFilter
        ? sortFilter.value
        : "";


    if(sort === "name"){

        filteredWalkins.sort(
            (a,b) =>
                String(a.name || "")
                .localeCompare(
                    String(b.name || "")
                )
        );

    }


    else if(sort === "id"){

        filteredWalkins.sort(
            (a,b) =>
                String(a.id || "")
                .localeCompare(
                    String(b.id || ""),
                    undefined,
                    {
                        numeric: true
                    }
                )
        );

    }


    else if(sort === "visit_date"){

        filteredWalkins.sort(
            (a,b) =>
                String(
                    b.visit_date || ""
                ).localeCompare(
                    String(
                        a.visit_date || ""
                    )
                )
        );

    }


    else if(sort === "total_visit"){

        filteredWalkins.sort(
            (a,b) =>
                Number(
                    b.total_visit || 0
                ) -
                Number(
                    a.total_visit || 0
                )
        );

    }


    currentWalkinPage = 1;

    renderWalkins();

}

async function loadMessageCount(){

    try{

        const res = await fetch(
            `${API_URL}/api/admin_messages`
        );

        if(!res.ok){

            throw new Error(
                `Messages API error: ${res.status}`
            );

        }

        const data = await res.json();

        const unread =
            data.filter(
                message => message.is_read == 0
            ).length;


        const badge =
            document.getElementById(
                "msg-count"
            );


        if(!badge)
            return;


        badge.innerText =
            unread > 99
            ? "99+"
            : unread;


        badge.style.display =
            unread > 0
            ? "flex"
            : "none";


    }
    catch(error){

        console.error(
            "MESSAGE COUNT ERROR:",
            error
        );

    }

}
/* =========================================================
   RENDER TABLE
========================================================= */

function renderWalkins(){

    const table =
        document.getElementById(
            "walkins-body"
        );


    const count =
        document.getElementById(
            "walkin-count"
        );


    if(!table)
        return;


    table.innerHTML = "";


    /* =========================
       EMPTY
    ========================= */

    if(
        filteredWalkins.length === 0
    ){

        table.innerHTML = `

            <tr>

                <td
                    colspan="5"
                    style="
                        text-align:center;
                        padding:25px;
                        color:#7a8982;
                    "
                >

                    No walk-in records found.

                </td>

            </tr>

        `;


        if(count){

            count.innerText =
                "Showing 0 walk-ins";

        }


        renderWalkinPagination();

        return;

    }


    /* =========================
       PAGINATION
    ========================= */

    const start =
        (
            currentWalkinPage - 1
        ) * walkinsPerPage;


    const end =
        start + walkinsPerPage;


    const pageData =
        filteredWalkins.slice(
            start,
            end
        );


    /* =========================
       TABLE ROWS
    ========================= */

    pageData.forEach(walkin => {

        const row =
            document.createElement(
                "tr"
            );


        row.innerHTML = `

            <td>
                ${walkin.id || "-"}
            </td>


            <td>
                ${walkin.name || "-"}
            </td>


            <td>
                ${walkin.phone || "-"}
            </td>


            <td>
                ${walkin.visit_date || "-"}
            </td>


            <td>
                ${walkin.total_visit || 0}
            </td>

        `;


        table.appendChild(row);

    });


    /* =========================
       COUNT
    ========================= */

    if(count){

        const showingStart =
            start + 1;


        const showingEnd =
            Math.min(
                end,
                filteredWalkins.length
            );


        count.innerText =
            `Showing ${showingStart}-${showingEnd} of ${filteredWalkins.length} walk-ins`;

    }


    renderWalkinPagination();

}


/* =========================================================
   PAGINATION
========================================================= */

function renderWalkinPagination(){

    const pagination =
        document.getElementById(
            "walkin-pagination"
        );


    if(!pagination)
        return;


    pagination.innerHTML = "";


    const totalPages =
        Math.ceil(
            filteredWalkins.length /
            walkinsPerPage
        );


    if(totalPages <= 1)
        return;


    /* =========================
       PREVIOUS
    ========================= */

    const previous =
        document.createElement(
            "button"
        );


    previous.className =
        "page-btn";


    previous.innerHTML =
        `<i class="fa-solid fa-chevron-left"></i>`;


    previous.disabled =
        currentWalkinPage === 1;


    previous.onclick = () => {

        if(
            currentWalkinPage > 1
        ){

            currentWalkinPage--;

            renderWalkins();

        }

    };


    pagination.appendChild(
        previous
    );


    /* =========================
       PAGE NUMBERS
    ========================= */

    for(
        let page = 1;
        page <= totalPages;
        page++
    ){

        if(
            totalPages > 6 &&
            page > 3 &&
            page < totalPages
        ){

            if(page === 4){

                const dots =
                    document.createElement(
                        "span"
                    );


                dots.className =
                    "page-dots";


                dots.innerText =
                    "...";


                pagination.appendChild(
                    dots
                );

            }

            continue;

        }


        const button =
            document.createElement(
                "button"
            );


        button.className =
            "page-btn";


        if(
            page ===
            currentWalkinPage
        ){

            button.classList.add(
                "active"
            );

        }


        button.innerText =
            page;


        button.onclick = () => {

            currentWalkinPage =
                page;


            renderWalkins();

        };


        pagination.appendChild(
            button
        );

    }


    /* =========================
       NEXT
    ========================= */

    const next =
        document.createElement(
            "button"
        );


    next.className =
        "page-btn";


    next.innerHTML =
        `<i class="fa-solid fa-chevron-right"></i>`;


    next.disabled =
        currentWalkinPage === totalPages;


    next.onclick = () => {

        if(
            currentWalkinPage <
            totalPages
        ){

            currentWalkinPage++;

            renderWalkins();

        }

    };


    pagination.appendChild(
        next
    );

}


/* =========================================================
   SEARCH EVENT
========================================================= */

document
    .getElementById(
        "walkinSearch"
    )
    .addEventListener(
        "input",
        applyWalkinFilters
    );


/* =========================================================
   SORT EVENT
========================================================= */

document
    .getElementById(
        "walkinSort"
    )
    .addEventListener(
        "change",
        applyWalkinFilters
    );


/* =========================================================
   INITIAL LOAD
========================================================= */

loadWalkins();
loadMessageCount();

</script>


</body>

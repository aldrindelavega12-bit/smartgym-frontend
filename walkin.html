<!DOCTYPE html>
<html>
<head>

    <title>Walk-ins</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"

<body>


<!-- =====================================================
     SIDEBAR
===================================================== -->

<div class="navbar">

    <!-- BRAND -->

    <div class="brand">

        <div class="brand-text">

            <strong>
                SMART GYM
            </strong>

            <span>
                STRONGER PEOPLE • A HEALTHIER TOMORROW
            </span>

        </div>

    </div>


    <!-- MENU -->

    <div

        id="menu">

</div>



<!-- =====================================================
     MAIN
===================================================== -->

<div class="layout">

    <div class="main">


        <!-- =================================================
             TOP HEADER
        ================================================== -->

        <div class="top-header">

            <div class="top-right">

                <div
                    class="staff-profile"

                    <div class="staff-avatar">
                        M
                    </div>

                    <div class="staff-info">

                        <strong>
                            Manager
                        </strong>

                        <small>
                            Gym Manager
                        </small>

                    </div>

                    <i class="fa-solid fa-chevron-down staff-profile-chevron"></i>


                    <!-- DROPDOWN -->

                    <div
                        id="staffDropdown"
                        class="staff-profile-dropdown">

                        <button
                            onclick="logout(); event.stopPropagation();"
                            class="staff-dropdown-logout">

                            <i class="fa-solid fa-right-from-bracket"></i>

                            Log Out

                        </button>

                    </div>

                </div>

            </div>

        </div>



        <!-- =================================================
             PAGE HEADER
        ================================================== -->

        <div class="page-header">

            <h1>
                Walk-ins
            </h1>

            <p>
                View and manage all walk-in records.
            </p>

        </div>



        <!-- =================================================
             WALK-IN PANEL
        ================================================== -->

        <div class="walkin-panel">


            <!-- =================================================
                 SEARCH + SORT
            ================================================== -->

            <div class="walkin-toolbar">


                <!-- SEARCH -->

                <div class="walkin-search">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input
                        type="text"
                        id="walkinSearch"
                        placeholder="Search name, or ID...">

                </div>


                <!-- SORT -->

                <select
                    id="walkinSort"
                    class="walkin-sort">

                    <option value="">
                        Sort by
                    </option>

                    <option value="name">
                        Name
                    </option>

                    <option value="id">
                        ID
                    </option>

                    <option value="visit_date">
                        Visit Date
                    </option>

                    <option value="total_visit">
                        Total Visit
                    </option>

                </select>

            </div>



            <!-- =================================================
                 TABLE
            ================================================== -->

            <div class="walkin-table-wrapper">

                <table class="walkin-table">

                    <thead>

                        <tr>

                            <th>
                                ID
                            </th>

                            <th>
                                Name
                            </th>


                            <th>
                                Visit Date
                            </th>

                            <th>
                                Total Visit
                            </th>

                            <th class="function-column">Action</th>

                        </tr>

                    </thead>


                    <tbody id="walkins-body">

                    </tbody>

                </table>

            </div>



            <!-- =================================================
                 FOOTER
            ================================================== -->

            <div class="walkin-footer">


                <div
                    id="walkin-count"
                    class="walkin-count">

                    Showing 0 walk-ins

                </div>


                <div
                    id="walkin-pagination"
                    class="pagination">

                </div>

            </div>


        </div>


    </div>

</div>



<!-- =====================================================
     NOTIFICATION POPUP
===================================================== -->

<div
    id="notifPopup"
    class="notif-popup">

    <b id="notifTitle">
        New Message
    </b>

    <p id="notifText">
        You have a new message
    </p>

</div>


<audio id="notifSound">

    <source
        src="notif.mp3"
        type="audio/mpeg">

</audio>


<!-- ACTION CONFIRMATION MODAL -->
<div id="memberActionModal" class="member-modal-overlay">
    <div class="member-modal">
        <div id="memberModalIcon" class="member-modal-icon archive">
            <i class="fa-solid fa-box-archive"></i>
        </div>

        <h3 id="memberModalTitle">Archive Walk-in?</h3>

        <p id="memberModalMessage">
            This walk-in will be moved to the Archive page.
        </p>

        <div class="member-modal-actions">
            <button type="button"
                    id="memberModalCancel"
                    class="member-modal-cancel">
                Cancel
            </button>

            <button type="button"
                    id="memberModalConfirm"
                    class="member-modal-confirm archive">
                Archive Walk-in
            </button>
        </div>
    </div>
</div>


<!-- SOCKET.IO -->

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>



<!-- =====================================================
     BASIC PAGE SCRIPT
     FUNCTIONALITY NEXT
===================================================== -->

<script>

const API_URL =
    "https://smartgym-api-ia2e.onrender.com";


const user =
    JSON.parse(
        localStorage.getItem("user")
    );


if(
    !user ||
    user.role !== "manager"
){

    window.location.href =
        "index.html";

}


/* =====================================================
   MENU
===================================================== */

const menu =
    document.getElementById("menu");


menu.innerHTML = `

    <a href="manager.html">


        Home

    </a>


    <a href="reports.html">


        Reports

    </a>


    <a href="members.html">



        Members

    </a>


    <a href="walkin.html"
       class="active">


        Walk-ins

    </a>


    <a href="staff_manage.html">


        Staff

    </a>

    <a href="archive.html">

        Archive

    </a>

`;



function showMemberActionModal({
    title,
    message,
    actionLabel,
    actionType,
    icon,
    onConfirm
}) {
    const modal = document.getElementById("memberActionModal");
    const modalIcon = document.getElementById("memberModalIcon");
    const confirmButton = document.getElementById("memberModalConfirm");
    const cancelButton = document.getElementById("memberModalCancel");

    document.getElementById("memberModalTitle").textContent = title;
    document.getElementById("memberModalMessage").textContent = message;

    modalIcon.className = `member-modal-icon ${actionType}`;
    modalIcon.innerHTML = `<i class="${icon}"></i>`;

    confirmButton.textContent = actionLabel;
    confirmButton.className = `member-modal-confirm ${actionType}`;

    modal.classList.add("show");

    const closeModal = () => {
        modal.classList.remove("show");
        confirmButton.onclick = null;
        cancelButton.onclick = null;
    };

    cancelButton.onclick = closeModal;

    modal.onclick = event => {
        if (event.target === modal) closeModal();
    };

    confirmButton.onclick = async () => {
        confirmButton.disabled = true;
        cancelButton.disabled = true;

        try {
            await onConfirm(closeModal);
        } finally {
            confirmButton.disabled = false;
            cancelButton.disabled = false;
        }
    };
}

/* =====================================================
   PROFILE DROPDOWN
===================================================== */

function toggleStaffMenu(){

    const profile =
        document.querySelector(
            ".staff-profile"
        );

    const dropdown =
        document.getElementById(
            "staffDropdown"
        );


    if(!dropdown)
        return;


    profile.classList.toggle(
        "active"
    );

    dropdown.classList.toggle(
        "show"
    );

}


window.addEventListener(
    "click",
    function(e){

        if(
            !e.target.closest(
                ".staff-profile"
            )
        ){

            const profile =
                document.querySelector(
                    ".staff-profile"
                );

            const dropdown =
                document.getElementById(
                    "staffDropdown"
                );


            if(profile)
                profile.classList.remove(
                    "active"
                );


            if(dropdown)
                dropdown.classList.remove(
                    "show"
                );

        }

    }
);



/* =====================================================
   LOGOUT
===================================================== */

function logout(){

    localStorage.clear();

    window.location.href =
        "index.html";

}

/* =========================================================
   WALK-IN DATA
========================================================= */

let allWalkins = [];

let filteredWalkins = [];

let currentWalkinPage = 1;

const walkinsPerPage = 8;


/* =========================================================
   LOAD WALK-INS
========================================================= */

async function loadWalkins(){

    try{

        const res =
            await fetch(
                `${API_URL}/api/website_walkins`,
                {
                    cache: "no-store"
                }
            );


        if(!res.ok){

            throw new Error(
                `HTTP ${res.status}`
            );

        }


        const result =
            await res.json();


        if(!result.success){

            throw new Error(
                result.error ||
                "Failed to load walk-ins."
            );

        }


        allWalkins =
            Array.isArray(result.data)
            ? result.data
            : [];


        applyWalkinFilters();


    }
    catch(error){

        console.error(
            "WALK-IN LOAD ERROR:",
            error
        );


        allWalkins = [];

        filteredWalkins = [];

        renderWalkins();

    }

}


/* =========================================================
   SEARCH + SORT
========================================================= */

function applyWalkinFilters(){

    const searchInput =
        document.getElementById(
            "walkinSearch"
        );

    const sortFilter =
        document.getElementById(
            "walkinSort"
        );


    const search =
        searchInput
        ? searchInput.value
            .trim()
            .toLowerCase()
        : "";


    /* =========================
       SEARCH
    ========================= */

    filteredWalkins =
        allWalkins.filter(walkin => {

            const id =
                String(
                    walkin.id || ""
                ).toLowerCase();


            const name =
                String(
                    walkin.name || ""
                ).toLowerCase();


            


            return (
                !search ||
                id.includes(search) ||
                name.includes(search)
            );

        });


    /* =========================
       SORT
    ========================= */

    const sort =
        sortFilter
        ? sortFilter.value
        : "";


    if(sort === "name"){

        filteredWalkins.sort(
            (a,b) =>
                String(a.name || "")
                .localeCompare(
                    String(b.name || "")
                )
        );

    }


    else if(sort === "id"){

        filteredWalkins.sort(
            (a,b) =>
                String(a.id || "")
                .localeCompare(
                    String(b.id || ""),
                    undefined,
                    {
                        numeric: true
                    }
                )
        );

    }


    else if(sort === "visit_date"){

        filteredWalkins.sort(
            (a,b) =>
                String(
                    b.visit_date || ""
                ).localeCompare(
                    String(
                        a.visit_date || ""
                    )
                )
        );

    }


    else if(sort === "total_visit"){

        filteredWalkins.sort(
            (a,b) =>
                Number(
                    b.total_visit || 0
                ) -
                Number(
                    a.total_visit || 0
                )
        );

    }


    currentWalkinPage = 1;

    renderWalkins();

}

async function loadMessageCount(){

    try{

        const res = await fetch(
            `${API_URL}/api/admin_messages`
        );

        if(!res.ok){

            throw new Error(
                `Messages API error: ${res.status}`
            );

        }

        const data = await res.json();

        const unread =
            data.filter(
                message => message.is_read == 0
            ).length;


        const badge =
            document.getElementById(
                "msg-count"
            );


        if(!badge)
            return;


        badge.innerText =
            unread > 99
            ? "99+"
            : unread;


        badge.style.display =
            unread > 0
            ? "flex"
            : "none";


    }
    catch(error){

        console.error(
            "MESSAGE COUNT ERROR:",
            error
        );

    }

}
/* =========================================================
   RENDER TABLE
========================================================= */

function renderWalkins(){

    const table =
        document.getElementById(
            "walkins-body"
        );


    const count =
        document.getElementById(
            "walkin-count"
        );


    if(!table)
        return;


    table.innerHTML = "";


    /* =========================
       EMPTY
    ========================= */

    if(
        filteredWalkins.length === 0
    ){

        table.innerHTML = `

            <tr>

                <td
                    colspan="5"
                    style="
                        text-align:center;
                        padding:25px;
                        color:#7a8982;
                    "
                >

                    No walk-in records found.

                </td>

            </tr>

        `;


        if(count){

            count.innerText =
                "Showing 0 walk-ins";

        }


        renderWalkinPagination();

        return;

    }


    /* =========================
       PAGINATION
    ========================= */

    const start =
        (
            currentWalkinPage - 1
        ) * walkinsPerPage;


    const end =
        start + walkinsPerPage;


    const pageData =
        filteredWalkins.slice(
            start,
            end
        );


    /* =========================
       TABLE ROWS
    ========================= */

    pageData.forEach(walkin => {

        const row =
            document.createElement(
                "tr"
            );


        row.innerHTML = `

            <td>
                ${walkin.id || "-"}
            </td>


            <td>
                ${walkin.name || "-"}
            </td>



            <td>
                ${walkin.visit_date || "-"}
            </td>


            <td>
                ${walkin.total_visit || 0}
            </td>

            <td class="function-column">
                <div class="member-action-menu">
                    <button
                        type="button"
                        class="member-menu-toggle"
                        onclick="toggleWalkinActions(this)"
                        aria-label="Walk-in actions"
                        aria-expanded="false">
                        <i class="fa-solid fa-ellipsis-vertical"></i>
                    </button>

                    <div class="member-menu-dropdown">
                        <button
                            type="button"
                            class="member-menu-item archive-item"
                            onclick="archiveWalkin('${walkin.id}')">
                            <i class="fa-solid fa-box-archive"></i>
                            Archive
                        </button>

                        <button
                            type="button"
                            class="member-menu-item delete-item"
                            onclick="deleteWalkin('${walkin.id}')">
                            <i class="fa-solid fa-trash"></i>
                            Delete
                        </button>
                    </div>
                </div>
            </td>

        `;


        table.appendChild(row);

    });


    /* =========================
       COUNT
    ========================= */

    if(count){

        const showingStart =
            start + 1;


        const showingEnd =
            Math.min(
                end,
                filteredWalkins.length
            );


        count.innerText =
            `Showing ${showingStart}-${showingEnd} of ${filteredWalkins.length} walk-ins`;

    }


    renderWalkinPagination();

}

function toggleWalkinActions(button) {
    const currentMenu = button.closest(".member-action-menu");
    const wasOpen = currentMenu.classList.contains("open");

    document.querySelectorAll(".member-action-menu.open")
        .forEach(menu => {
            menu.classList.remove("open");

            const toggle = menu.querySelector(".member-menu-toggle");
            if (toggle) {
                toggle.setAttribute("aria-expanded", "false");
            }
        });

    if (!wasOpen) {
        currentMenu.classList.add("open");
        button.setAttribute("aria-expanded", "true");
    }
}

document.addEventListener("click", function(event) {
    if (!event.target.closest(".member-action-menu")) {
        document.querySelectorAll(".member-action-menu.open")
            .forEach(menu => {
                menu.classList.remove("open");

                const toggle = menu.querySelector(".member-menu-toggle");
                if (toggle) {
                    toggle.setAttribute("aria-expanded", "false");
                }
            });
    }
});



/* =====================================================
   WALK-IN ACTION MENU
===================================================== */

function toggleWalkinActions(button) {
    const currentMenu = button.closest(".member-action-menu");
    if (!currentMenu) return;

    const wasOpen = currentMenu.classList.contains("open");

    document.querySelectorAll(".member-action-menu.open").forEach(menu => {
        menu.classList.remove("open");

        const toggle = menu.querySelector(".member-menu-toggle");
        if (toggle) toggle.setAttribute("aria-expanded", "false");
    });

    if (!wasOpen) {
        currentMenu.classList.add("open");
        button.setAttribute("aria-expanded", "true");
    }
}

document.addEventListener("click", function (event) {
    if (event.target.closest(".member-action-menu")) return;

    document.querySelectorAll(".member-action-menu.open").forEach(menu => {
        menu.classList.remove("open");

        const toggle = menu.querySelector(".member-menu-toggle");
        if (toggle) toggle.setAttribute("aria-expanded", "false");
    });
});


/* =====================================================
   ARCHIVE WALK-IN
===================================================== */

async function archiveWalkin(walkinId) {
    if (!user || !user.user_id) {
        alert("Unable to identify the logged-in manager.");
        return;
    }

    if (!confirm("Are you sure you want to archive this walk-in?")) {
        return;
    }

    try {
        const response = await fetch(
            `${API_URL}/api/archive/walkin/${encodeURIComponent(walkinId)}`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    actor_id: user.user_id
                })
            }
        );

        const result = await response.json();

        if (!response.ok || result.success === false) {
            throw new Error(
                result.error || result.message || "Failed to archive walk-in."
            );
        }

        alert("Walk-in archived successfully.");

        await loadWalkins();

    } catch (error) {
        console.error("ARCHIVE WALK-IN ERROR:", error);
        alert(error.message || "Failed to archive walk-in.");
    }
}


/* =====================================================
   DELETE WALK-IN
===================================================== */

async function deleteWalkin(walkinId) {
    if (!user || !user.user_id) {
        alert("Unable to identify the logged-in manager.");
        return;
    }

    if (!confirm(
        "Are you sure you want to permanently delete this walk-in? This action cannot be undone."
    )) {
        return;
    }

    try {
        const response = await fetch(
            `${API_URL}/api/records/walkin/${encodeURIComponent(walkinId)}`,
            {
                method: "DELETE",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    actor_id: user.user_id
                })
            }
        );

        const result = await response.json();

        if (!response.ok || result.success === false) {
            throw new Error(
                result.error || result.message || "Failed to delete walk-in."
            );
        }

        alert("Walk-in deleted successfully.");

        await loadWalkins();

    } catch (error) {
        console.error("DELETE WALK-IN ERROR:", error);
        alert(error.message || "Failed to delete walk-in.");
    }
}

/* =========================================================
   PAGINATION
========================================================= */

function renderWalkinPagination(){

    const pagination =
        document.getElementById(
            "walkin-pagination"
        );


    if(!pagination)
        return;


    pagination.innerHTML = "";


    const totalPages =
        Math.ceil(
            filteredWalkins.length /
            walkinsPerPage
        );


    if(totalPages <= 1)
        return;


    /* =========================
       PREVIOUS
    ========================= */

    const previous =
        document.createElement(
            "button"
        );


    previous.className =
        "page-btn";


    previous.innerHTML =
        `<i class="fa-solid fa-chevron-left"></i>`;


    previous.disabled =
        currentWalkinPage === 1;


    previous.onclick = () => {

        if(
            currentWalkinPage > 1
        ){

            currentWalkinPage--;

            renderWalkins();

        }

    };


    pagination.appendChild(
        previous
    );


    /* =========================
       PAGE NUMBERS
    ========================= */

    for(
        let page = 1;
        page <= totalPages;
        page++
    ){

        if(
            totalPages > 6 &&
            page > 3 &&
            page < totalPages
        ){

            if(page === 4){

                const dots =
                    document.createElement(
                        "span"
                    );


                dots.className =
                    "page-dots";


                dots.innerText =
                    "...";


                pagination.appendChild(
                    dots
                );

            }

            continue;

        }


        const button =
            document.createElement(
                "button"
            );


        button.className =
            "page-btn";


        if(
            page ===
            currentWalkinPage
        ){

            button.classList.add(
                "active"
            );

        }


        button.innerText =
            page;


        button.onclick = () => {

            currentWalkinPage =
                page;


            renderWalkins();

        };


        pagination.appendChild(
            button
        );

    }


    /* =========================
       NEXT
    ========================= */

    const next =
        document.createElement(
            "button"
        );


    next.className =
        "page-btn";


    next.innerHTML =
        `<i class="fa-solid fa-chevron-right"></i>`;


    next.disabled =
        currentWalkinPage === totalPages;


    next.onclick = () => {

        if(
            currentWalkinPage <
            totalPages
        ){

            currentWalkinPage++;

            renderWalkins();

        }

    };


    pagination.appendChild(
        next
    );

}


/* =========================================================
   SEARCH EVENT
========================================================= */

document
    .getElementById(
        "walkinSearch"
    )
    .addEventListener(
        "input",
        applyWalkinFilters
    );


/* =========================================================
   SORT EVENT
========================================================= */

document
    .getElementById(
        "walkinSort"
    )
    .addEventListener(
        "change",
        applyWalkinFilters
    );


/* =========================================================
   INITIAL LOAD
========================================================= */

loadWalkins();
loadMessageCount();

</script>

</html>
